# Baseline CI pipeline (Steuereule).
#
# The Docker Compose files (docker-compose.yml + the ci/e2e overlays) are the
# foundation this pipeline is built on. `build` is still an honest placeholder
# (grows as buildable-image work lands); `lint`, `test`, `integration`, `smoke`
# and `cross-origin-smoke` are real, CI-blocking gates.
#
# `lint` runs oxlint (ADR-0019) — a syntactic gate only; type-aware rules are
# knowingly deferred to `tsc --strict` in the `test` job (#168). "CI: green"
# now covers a real lint pass for the first time, but not that gap.
#
# Flow:  validate-compose ──► lint ──────────────► build ──► smoke
#                          ├─► test ───────────────┤    └─► cross-origin-smoke
#                          └─► integration ─────────┘
#        docs-consistency (standalone — reads docs/, needs no build)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One in-flight run per ref; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Real gate today: the three compose file combinations must parse.
  validate-compose:
    name: Validate compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: base
        run: docker compose -f docker-compose.yml config
      - name: base + ci overlay
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml config
      - name: base + e2e overlay
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml config

  # Real gate (#168): oxlint (ADR-0019) against the whole repo. Purely syntactic —
  # no Prisma, no Postgres, no Playwright — so it stays the cheap ~0.1s check that
  # runs before the expensive jobs. Runs `pnpm lint` (`oxlint --deny-warnings`),
  # never bare `oxlint`: a bare run exits 0 even when it reports findings
  # (measured), so the exit code has to come from a step that actually fails on
  # findings, not be assumed. Never invoke oxlint with `--config` here — in oxlint
  # 1.76.0 that silently disables `ignorePatterns` (ADR-0019 §5, measured: 276
  # findings vs 0) — `.oxlintrc.json` lives at the repo root specifically so it is
  # auto-discovered.
  lint:
    name: Lint
    needs: validate-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint (oxlint --deny-warnings, ADR-0019 — auto-discovered config, exit code asserted)
        run: pnpm lint

  # Real gate: typecheck and test every workspace package in the monorepo (no-DB
  # unit/pure-logic suite — DB-requiring tests live in the `integration` job below,
  # ADR-0004).
  test:
    name: Test
    needs: validate-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm --filter @steuereule/api prisma:generate
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test
        run: pnpm -r test

  # Real gate (#66, extended for Slice 2/ADR-0012): proves the DSGVO-critical
  # guarantees — REQ-003 field-encryption at rest, REQ-004 append-only audit log,
  # and now REQ-005/006/009/010's auth acceptance suites (email/password signup +
  # verification, session/guard precedence, guest->account upgrade, security
  # hardening) — against a real, migrated Postgres, not just the no-DB unit suite.
  # A GitHub Actions service container (rather than docker-compose) because the test
  # process runs natively on the runner (ADR-0010) — the compose stack's `postgres`
  # service is the parity image for the *local*/e2e stack, not this job's database.
  integration:
    name: Integration (Postgres)
    needs: validate-compose
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: steuereule
          POSTGRES_PASSWORD: steuereule
          POSTGRES_DB: steuereule
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U steuereule -d steuereule"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://steuereule:steuereule@localhost:5432/steuereule
      # Synthetic, dev-only (ADR-0012) — vitest.integration.config.ts already sets
      # these for the test process, but declared here too for the same reason
      # DATABASE_URL is: this job's env is meant to be self-documenting about what
      # it actually exercises.
      BETTER_AUTH_SECRET: ci-integration-test-better-auth-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      # #241: no real reverse proxy in front of this job's server — declared
      # explicitly for the same self-documenting reason as the two lines above.
      TRUSTED_PROXIES: none
    steps:
      - uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm --filter @steuereule/api prisma:generate
      - name: Apply migrations (migrate deploy, never migrate dev)
        run: pnpm --filter @steuereule/api migrate:deploy
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # REQ-011/ADR-0013 §7: the export acceptance/integration suites render a real
      # PDF-Bericht through PlaywrightPdfRenderer — a genuine Chromium launch, not a
      # stub — so this job needs the same browser binary the cross-origin-smoke job
      # already installs (same command, same rationale: `playwright-core`'s
      # registered bin is `playwright-core`, not `playwright`).
      - name: Install Playwright's Chromium (for the REQ-011 PDF export suites)
        run: pnpm --filter @steuereule/api exec playwright-core install chromium --with-deps
      - name: Integration + acceptance tests — encryption/audit + REQ-005/006/009/010/011 (ADR-0012/ADR-0013)
        run: pnpm --filter @steuereule/api test:integration

  # Real gate (#221, and the register-ownership decision landing via #251) — turns
  # docs/requirements/register.md and docs/adr/ from a
  # claim, checked only when a human happens to re-read it, into a control (ADR-0021): both
  # register-check and adr-check are proven by breaking them, not by watching them pass — see
  # scripts/checks/README.md and this job's own PR evidence block for the six break/restore
  # transcripts.
  #
  # Standalone (no `needs`): this reads docs/ and the vitest configs' source text directly, no
  # build/Postgres/browser required, so it's cheap and gives the fastest possible signal on a
  # docs-only PR. No `pnpm install` either — everything under scripts/checks is plain Node
  # (`fs`, `fetch`), deliberately dependency-free (see the README).
  docs-consistency:
    name: Docs consistency — register-check + adr-check
    runs-on: ubuntu-latest
    # F7 (Musti's review on #252): the only job in this pipeline that hands GITHUB_TOKEN to a
    # `fetch()` call (check 5's issue-open lookup) — with no permissions: block anywhere in
    # this workflow, that token would carry the repository's default, which can be far wider
    # than "read one issue". Least privilege, stated explicitly rather than inherited.
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          # actions/setup-node@v5's package-manager-cache auto-detection defaults to true and
          # reads root package.json's `packageManager` field, expecting `pnpm` already on
          # PATH to cache its store — but this job runs no `pnpm install` (see above), so
          # `pnpm` was never installed here and the step failed with "Unable to locate
          # executable file: pnpm" (observed on this PR's own first CI run, run 30846683020,
          # job 91796590386 — exactly ADR-0021's own defect class: a declared-but-not-connected
          # default). Explicitly opted out rather than adding an unneeded pnpm/install step.
          package-manager-cache: false
      - name: register-check — docs/requirements/register.md against the real repo (checks 1-5)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/checks/register-check.mjs
      - name: adr-check — docs/adr/ numbering, index, cross-references (check 6)
        # if: '!cancelled()' — otherwise a red register-check step (the normal, default
        # GitHub Actions step behaviour: a failed step skips every step after it) silently
        # skips adr-check entirely, hiding a real ADR-numbering collision behind an unrelated
        # register finding. Observed on this PR's own first passing run (30846993334, job
        # 91797618882): register-check's real pre-existing findings correctly failed the
        # step, and adr-check's step showed "skipped" right below it — the two checks must
        # report independently since either one, alone, is what the reviewer needs to see.
        # `always()` was the first fix but is too broad (Musti's F8 review on #252): it also
        # runs this step when the *job itself* is cancelled, which this workflow's own
        # `cancel-in-progress: true` concurrency group (ci.yml, top of file) makes routine,
        # not exotic — `!cancelled()` gives the same behaviour on success/failure and the
        # correct one on cancellation.
        #
        # Runs against whatever `actions/checkout` resolved for this event — for a
        # `pull_request` run, that's the synthetic merge commit (refs/pull/N/merge) by
        # default, which is the whole mechanism behind catching a cross-PR ADR-number
        # collision (see scripts/checks/adr-check.mjs's header comment for the honest limit:
        # this only re-checks on a new push, and only until #71/branch protection lands).
        if: '!cancelled()'
        run: node scripts/checks/adr-check.mjs

  # Placeholder — build the service images once Dockerfiles exist.
  build:
    name: Build
    needs: [lint, test, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build (placeholder)
        run: |
          echo "TODO — no images to build yet; baseline is empty."

  # Real gate (#69): boots the actual compiled server over real HTTP — not
  # `.inject()` — against a real, migrated Postgres, and asserts a golden-path
  # request succeeds. Exists specifically to catch the class of bug `.inject()`-only
  # tests are structurally blind to (the missing-`@fastify/static` boot crash, the
  # CORS gap) before it reaches a human or the acceptance/e2e tier.
  smoke:
    name: Smoke
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: steuereule
          POSTGRES_PASSWORD: steuereule
          POSTGRES_DB: steuereule
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U steuereule -d steuereule"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://steuereule:steuereule@localhost:5432/steuereule
      # Synthetic, dev-only values (ADR-0008/§4.2) — never real secrets. Production
      # requires both to be set explicitly (resolveGuestSessionSecret /
      # resolveFieldEncryptionKey refuse a guessable default under NODE_ENV=production).
      GUEST_SESSION_SECRET: ci-smoke-test-secret
      PRISMA_FIELD_ENCRYPTION_KEY: k1.aesgcm256.MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      # Synthetic, dev-only (ADR-0012) — same story as the two secrets above:
      # production requires both set explicitly (resolveBetterAuthSecret /
      # resolveBetterAuthUrl refuse a guessable default under NODE_ENV=production).
      BETTER_AUTH_SECRET: ci-smoke-test-better-auth-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      PORT: '3000'
      # The local Expo web dev origin (same value as apps/api/.env.example) — lets the
      # smoke request below send a real, allow-listed Origin so it can assert the
      # actual CORS response header, not just that the server answers (ADR-0011).
      CORS_ALLOWED_ORIGINS: http://localhost:8081
      # #241: no real reverse proxy in front of this job's server — declared
      # explicitly, same self-documenting reason as the two lines above.
      TRUSTED_PROXIES: none
    steps:
      - uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm --filter @steuereule/api prisma:generate
      - name: Apply migrations (migrate deploy, never migrate dev)
        run: pnpm --filter @steuereule/api migrate:deploy
      - name: Build the API
        run: pnpm --filter @steuereule/api build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # REQ-011/ADR-0013 §7: the PDF-export smoke check below needs a real Chromium to
      # render against — same install as the `integration` job, same rationale.
      - name: Install Playwright's Chromium (for the REQ-011 PDF export smoke check)
        run: pnpm --filter @steuereule/api exec playwright-core install chromium --with-deps
      - name: Boot the real server
        # `node dist/main.js` alone cannot resolve `@steuereule/core` — it ships TS
        # source (`main: ./src/index.ts`, extensionless internal imports), so plain
        # Node's ESM resolver throws ERR_MODULE_NOT_FOUND. `--import tsx` is a bridge
        # for that packaging quirk (ADR-0010a), not the production answer — it still
        # boots the *compiled* `dist/`, so a real dist-wiring regression (the
        # `@fastify/static` class of bug) is still caught. See the PR notes: the
        # proper fix (give @steuereule/core a real build/exports map, or bundle the
        # API) is a forward-looking packaging decision, tracked as its own follow-up.
        working-directory: apps/api
        run: |
          node --import tsx dist/main.js > /tmp/steuereule-api-smoke.log 2>&1 &
          echo $! > /tmp/steuereule-api-smoke.pid
      - name: Smoke request — GET /v1/profile over real HTTP (poll, no sleep — ADR-0004)
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 1 --retry-all-errors --retry-connrefused \
            http://localhost:3000/v1/profile
      - name: Smoke request — GET /api/auth/get-session over real HTTP (ADR-0012 §1)
        # Proves better-auth's Fastify catch-all mount actually answers on the real,
        # booted server — the exact class of bug `.inject()` (light-my-request,
        # never a real socket) is structurally blind to: the content-type-parser
        # encapsulation wiring in mount-better-auth.ts only breaks when a real
        # request hits a real listening Fastify instance.
        #
        # Sends a real `Origin` header and asserts the echoed CORS header, not just a
        # 2xx: this route is `reply.hijack()`'d (mount-better-auth.ts), which bypasses
        # Fastify's `onSend` hook chain that `app.enableCors(...)` relies on elsewhere —
        # an Origin-less request would answer fine either way and could never catch
        # that class of regression on this one tier that boots the compiled `dist/`
        # over a real external socket (integration-tier coverage lives in
        # apps/api/test/acceptance/auth-mount-cors.test.ts).
        run: |
          headers=$(curl --fail --silent --show-error \
            --retry 30 --retry-delay 1 --retry-all-errors --retry-connrefused \
            -D - -o /dev/null \
            -H "Origin: ${CORS_ALLOWED_ORIGINS}" \
            http://localhost:3000/api/auth/get-session | tr -d '\r')
          echo "$headers"
          echo "$headers" | grep -qi "^access-control-allow-origin: ${CORS_ALLOWED_ORIGINS}$" || {
            echo "::error::Expected 'Access-Control-Allow-Origin: ${CORS_ALLOWED_ORIGINS}' on /api/auth/get-session for an allow-listed Origin — CORS regression on the hijacked better-auth mount (ADR-0011/ADR-0012 §1)."
            exit 1
          }
      - name: Smoke request — GET /v1/steuerjahre/2026/cockpit over real HTTP (REQ-001, steuereule#91)
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 1 --retry-all-errors --retry-connrefused \
            http://localhost:3000/v1/steuerjahre/2026/cockpit
      - name: Smoke request — REQ-011 DSGVO export, both formats, over real HTTP
        # Signs a real account up (cookie jar carries the resulting session), saves a
        # Profile, then exercises both `?format=` branches of GET /v1/account/export
        # against the compiled, listening server — proves the real PlaywrightPdfRenderer
        # actually launches Chromium and returns real PDF bytes in this runtime shape,
        # not just under `.inject()` (ADR-0013 §7's honest infra note: this is exactly
        # the Chromium-in-the-runtime-image question, exercised here in CI's own image).
        run: |
          set -e
          JAR=$(mktemp)
          curl --fail --silent --show-error -c "$JAR" -b "$JAR" \
            -H "Content-Type: application/json" -H "Origin: ${CORS_ALLOWED_ORIGINS}" \
            -X POST http://localhost:3000/api/auth/sign-up/email \
            -d '{"email":"ci-smoke-export@example.com","password":"a-fine-strong-password-1","name":"CI Smoke Export"}' \
            > /dev/null
          curl --fail --silent --show-error -c "$JAR" -b "$JAR" \
            -H "Content-Type: application/json" -H "Origin: ${CORS_ALLOWED_ORIGINS}" \
            -X PUT http://localhost:3000/v1/profile \
            -d '{"firstName":"CI","lastName":"Smoke","steuerId":"02476291358","steuernummer":"18181508155"}' \
            > /dev/null

          json_headers=$(curl --fail --silent --show-error -b "$JAR" -D - -o /tmp/steuereule-export-smoke.json \
            "http://localhost:3000/v1/account/export?format=json")
          echo "$json_headers" | grep -qi '^content-type: application/json' || {
            echo "::error::GET /v1/account/export?format=json did not return application/json."
            exit 1
          }
          grep -q '"schemaVersion":"1.0"' /tmp/steuereule-export-smoke.json || {
            echo "::error::JSON export body missing the expected schemaVersion — got: $(cat /tmp/steuereule-export-smoke.json)"
            exit 1
          }

          pdf_headers=$(curl --fail --silent --show-error -b "$JAR" -D - -o /tmp/steuereule-export-smoke.pdf \
            "http://localhost:3000/v1/account/export?format=pdf")
          echo "$pdf_headers" | grep -qi '^content-type: application/pdf' || {
            echo "::error::GET /v1/account/export?format=pdf did not return application/pdf."
            exit 1
          }
          head -c 5 /tmp/steuereule-export-smoke.pdf | grep -q '%PDF-' || {
            echo "::error::PDF export body did not start with the %PDF- magic bytes — real Chromium render never happened."
            exit 1
          }
      - name: Server log (on failure)
        if: failure()
        run: cat /tmp/steuereule-api-smoke.log || true
      - name: Stop the server
        if: always()
        run: |
          if [ -f /tmp/steuereule-api-smoke.pid ]; then
            kill "$(cat /tmp/steuereule-api-smoke.pid)" 2>/dev/null || true
          fi

  # Real gate (M2 CI-hardening) — automates the class of bug that broke the deployed
  # demo TWICE and was invisible to every unit/integration test and to `curl`/Node's own
  # `fetch()` (neither enforces CORS the way a browser does): #106 (the hijacked
  # better-auth mount silently dropping CORS headers on the real, non-OPTIONS response)
  # and #108 (`enableCors`'s default `methods` list silently excluding PUT, failing the
  # browser's real preflight). Both were only ever caught by Salih's manual cross-origin
  # Playwright pass — this job is that pass, automated and CI-blocking.
  #
  # Boots the compiled `dist/` API on one origin and serves the exported web bundle
  # (`expo export --platform web`) on a genuinely different origin (different port —
  # sufficient for the browser's same-origin policy, which keys on scheme+host+port),
  # then drives a real headless Chromium page (already-installed browser, ADR-0004) that
  # executes actual credentialed `fetch()` calls from the web origin at the API origin:
  # signup, get-session, sign-out, login, get-session again, and a PUT /v1/profile. Each
  # call is checked two ways — (a) the in-page fetch must actually resolve (a real
  # browser rejects the promise outright when CORS is broken, `net::ERR_FAILED`/"Failed
  # to fetch" — exactly how #106/#108 manifest to a real user) and (b) the actual wire
  # response is inspected via Playwright's network events for a genuine
  # `Access-Control-Allow-Origin: <web origin>` header, not merely inferred from the
  # fetch succeeding.
  #
  # See e2e/cross-origin/run.mjs for the full rationale/mechanics.
  #
  # Also runs the ADR-0014 responsive breakpoint gate (e2e/responsive/breakpoint-layout.mjs)
  # as an extra step below, rather than as its own job. That script needs exactly this
  # job's stack — a real, migrated Postgres, the compiled API booted and reachable, and
  # the exported web bundle statically served with EXPO_PUBLIC_API_BASE_URL baked in at
  # the same origin the script's flows drive (the #177 assertions sign a real guest and a
  # real account up through the running app) — so standing up a second full stack just to
  # run a second Playwright script would duplicate CI minutes for no isolation benefit;
  # nothing about the two scripts' assertions conflicts. Before this, the script existed
  # only as a local dev/CI-author tool nothing invoked in CI — ADR-0021's own defect
  # class (#197 found its `measureScreenMaxWidth` never reached a real screen either, for
  # the same reason).
  #
  # Known, deliberately-not-fixed-here gap (also #197, documented in
  # breakpoint-layout.mjs itself): the script's primary locator,
  # `[data-testid="screen-container"]`, never matches anything in the exported build —
  # react-native-web forwards a `testID` prop to `data-testid`, not a literal
  # `data-testid` prop, so every assertion has always fallen through to the script's own
  # div-scan fallback. That fallback is what this PR's own CI control proof (break
  # `EXPECTED_MAX_WIDTH.s`, watch the job go red; restore, watch it pass) exercised, and
  # what #197's *local* break/restore of `width: 100%` exercised — local by necessity,
  # since this PR is what first runs the script in CI at all: #197's pipeline could not
  # have executed breakpoint-layout.mjs, full stop. The #177 button-fills-parent
  # assertions have been observed green in CI (this PR's own run 30425139957, commit
  # `1668b3d`, carrying the script content Kaan finalised at `950d524`) but never red in
  # CI — only on a laptop; they fail through the same `fail()` helper whose
  # propagation this PR's CI cycle proved. That composed argument is why wiring proceeds
  # rather than waiting on the selector fix, with its one soft edge named rather than
  # hidden. But it means this job is currently gated by the fallback path, not the
  # primary one; fixing the six screens' `data-testid` → `testID` is tracked as its own
  # follow-up (#201) — which will need its own fresh break/restore cycle once the primary
  # selector starts matching, since this PR's proof will no longer be proving the code
  # that runs.
  # #223 adds two more steps below (`e2e/responsive/banner-ds-qa.mjs`,
  # `e2e/visibility/visibility-refetch.mjs`), promoting the manual proof already run on PRs
  # #215/#225 into a standing regression gate for REQ-005's "shown honestly" clause — the
  # unverified/verified banner on RegistrierungScreen and LoginScreen must be a LIVE read via the
  # shared `useEmailVerified` hook, never a value snapshotted and left stale. Two separate
  # scripts, not one (Musti's #223 ruling): a DS-fidelity regression (wrong banner colour/token)
  # and a mechanism regression (the banner never updates, or updates when it shouldn't) are
  # different failure modes and must not share one red/green signal. Both ride this job rather
  # than a new one for the same reason `breakpoint-layout.mjs` does — see the header comment
  # above.
  cross-origin-smoke:
    # The job's `name` is the check name shown on the PR and pinned by branch protection
    # once #71 lands — it must describe every gate this job runs, or a future regression fails a
    # required check whose name points at the wrong subsystem. The job key stays
    # `cross-origin-smoke` (nothing references it); only the display name changes. Renamed here,
    # while #71 is still open (Musti's #223 ruling) — after #71 lands, a rename costs a branch
    # protection edit plus a window where the required check doesn't exist, so this is the free
    # window to take it in.
    name: Browser gates — cross-origin + responsive + live-verify
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: steuereule
          POSTGRES_PASSWORD: steuereule
          POSTGRES_DB: steuereule
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U steuereule -d steuereule"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://steuereule:steuereule@localhost:5432/steuereule
      GUEST_SESSION_SECRET: ci-cross-origin-smoke-secret
      PRISMA_FIELD_ENCRYPTION_KEY: k1.aesgcm256.MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      BETTER_AUTH_SECRET: ci-cross-origin-smoke-better-auth-secret-0123456789
      # The two origins are genuinely distinct (different ports — different from the
      # `smoke` job's :3000/:8081 pair on purpose, so a reader never conflates the two
      # jobs' server instances).
      API_ORIGIN: http://localhost:3301
      WEB_ORIGIN: http://localhost:4173
      BETTER_AUTH_URL: http://localhost:3301
      PORT: '3301'
      CORS_ALLOWED_ORIGINS: http://localhost:4173
      # #241: no real reverse proxy in front of this job's server either.
      TRUSTED_PROXIES: none
      EXPO_PUBLIC_API_BASE_URL: http://localhost:3301
    steps:
      - uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm --filter @steuereule/api prisma:generate
      - name: Apply migrations (migrate deploy, never migrate dev)
        run: pnpm --filter @steuereule/api migrate:deploy
      - name: Build the API
        run: pnpm --filter @steuereule/api build
      - name: Export the web bundle (offline/static web build, EXPO_PUBLIC_* baked in)
        run: pnpm --filter @steuereule/mobile-web exec expo export --platform web
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright's Chromium (browser only, no OS deps re-check needed on ubuntu-latest's image)
        # e2e only depends on `playwright-core` (the library the smoke script actually
        # imports — no test-runner needed), whose registered bin is named
        # `playwright-core`, not `playwright`. `pnpm exec playwright ...` resolves bins
        # by their registered name, so it fails with "Command \"playwright\" not found"
        # even though the package is installed (#120 CI run). `playwright-core`'s CLI
        # ships the same `install` subcommand as the `playwright` package's CLI.
        run: pnpm --filter @steuereule/e2e exec playwright-core install chromium --with-deps
      - name: Boot the real server (compiled dist/, same tsx bridge as the `smoke` job)
        working-directory: apps/api
        run: |
          node --import tsx dist/main.js > /tmp/steuereule-api-cross-origin.log 2>&1 &
          echo $! > /tmp/steuereule-api-cross-origin.pid
      - name: Serve the exported web bundle on its own origin
        run: |
          node e2e/cross-origin/static-server.mjs --root apps/mobile-web/dist --port 4173 --host localhost \
            > /tmp/steuereule-web-cross-origin.log 2>&1 &
          echo $! > /tmp/steuereule-web-cross-origin.pid
      - name: Wait for both origins to answer (poll, no sleep)
        run: |
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors --retry-connrefused \
            "${API_ORIGIN}/v1/profile"
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors --retry-connrefused \
            "${WEB_ORIGIN}/"
      - name: Cross-origin browser smoke — signup, login, get-session, PUT /v1/profile
        run: node e2e/cross-origin/run.mjs
      - name: Responsive breakpoint layout gate (ADR-0014) — real browser, s/m/l assertions
        # Shares this job's already-running API + statically-served web bundle (see the
        # job header comment above for why this rides here rather than its own job). Only
        # needs WEB_ORIGIN — the script drives the app through the browser itself (a real
        # guest sign-up + onboarding, a real account sign-up), it never calls the API
        # directly, so API_ORIGIN is not passed.
        run: node e2e/responsive/breakpoint-layout.mjs
      - name: Banner DS-QA gate (#223) — verify-banner colour/token fidelity, s/m/l, both screens
        # Only needs WEB_ORIGIN — both screens' unverified banner is reached purely by driving
        # the real UI (sign-up through RegistrierungScreen, then sign-in with that same account
        # through LoginScreen), no DB/API access needed.
        run: node e2e/responsive/banner-ds-qa.mjs
      - name: Visibility-refetch gate (#223) — live re-read of email verification, both screens
        # Needs DATABASE_URL (already set in this job's env, above) to flip `emailVerified`
        # directly — there is no mail client in this environment (#224 is the still-manual,
        # permanently out-of-automation-scope iOS complement; see e2e/visibility/
        # visibility-refetch.mjs's header comment). Relies on `psql` already being present on the
        # `ubuntu-latest` runner image (no install step) — the `runner-images` catalogue for this
        # image lists the PostgreSQL client tools as preinstalled.
        run: node e2e/visibility/visibility-refetch.mjs
      - name: API log (on failure)
        if: failure()
        run: cat /tmp/steuereule-api-cross-origin.log || true
      - name: Web static server log (on failure)
        if: failure()
        run: cat /tmp/steuereule-web-cross-origin.log || true
      - name: Stop the servers (PID-scoped only — #114, never a blanket process kill)
        if: always()
        run: |
          if [ -f /tmp/steuereule-api-cross-origin.pid ]; then
            kill "$(cat /tmp/steuereule-api-cross-origin.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/steuereule-web-cross-origin.pid ]; then
            kill "$(cat /tmp/steuereule-web-cross-origin.pid)" 2>/dev/null || true
          fi
