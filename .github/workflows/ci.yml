# Build & E2E pipeline (Steuereule): the production build with SBOM and container scan, then every gate
# that needs the built app: smoke, the browser gates, the E2E scenario matrix and the production compose stack.
# The other pipelines are their own workflows, each with its own entry in the Actions sidebar:
# quality.yml (compose validation, lint, typecheck + unit tests, integration, Sonar, docs, Vordrucke),
# security.yml (static security scans), load.yml (many-user load test) and ai-eval-nightly.yml (AI evals).
# All of them start in parallel on a pull request; merging waits for the required checks of every one.
#
# Flow:  build ──► smoke
#              ├─► e2e-build ──► e2e-gates (one job per group of e2e/gates.json) ──► cross-origin-smoke*
#              │   e2e-plan ───┘
#              ├─► e2e-scenarios / e2e-self-employed
#              └─► prod-stack-smoke + prod-stack-dast ──► prod-deploy-smoke*
#
# * aggregate jobs that keep the name of the required check (the ruleset pins check names), see docs/ci-pipeline.md.
name: Build & E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One in-flight run per ref; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default token permissions across the entire CI workflow.
permissions:
  contents: read

jobs:
  # Real production build, CycloneDX SBOM generation, Trivy container image vulnerability scan,
  # and Web Bundle Security / Size Budget gate.
  build:
    name: 'supply-chain: build, SBOM, container scan & bundle gate'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - name: Export web bundle & run Bundle Security + Size Budget Gate
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.steuereule.de
        run: |
          pnpm --filter @steuereule/mobile-web exec expo export --platform web
          node scripts/checks/bundle-security-check.mjs
      - name: Build production API Docker image (non-root USER node)
        run: docker build -f apps/api/Dockerfile -t steuereule-api:ci .
      - name: Build production Web Docker image (non-root USER node)
        run: docker build -f apps/mobile-web/Dockerfile --build-arg EXPO_PUBLIC_API_BASE_URL=https://api.steuereule.de -t steuereule-web:ci .
      - name: Generate CycloneDX SBOM for repository (pnpm-lock.yaml)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom-repo.cdx.json
      - name: Generate CycloneDX SBOM for API container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: steuereule-api:ci
          format: cyclonedx
          output: sbom-api.cdx.json
      - name: Generate CycloneDX SBOM for Web container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: steuereule-web:ci
          format: cyclonedx
          output: sbom-web.cdx.json
      - name: Trivy Container Scan — steuereule-api:ci (HIGH/CRITICAL blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: steuereule-api:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
      - name: Trivy Container Scan — steuereule-web:ci (HIGH/CRITICAL blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: steuereule-web:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
      - name: Upload CycloneDX SBOM artifacts (CRA /BSI TR-03183 compliance)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cyclonedx-sbom
          path: |
            sbom-repo.cdx.json
            sbom-api.cdx.json
            sbom-web.cdx.json
          retention-days: 90

  # Real gate (#69): boots the actual compiled server over real HTTP — not
  # `.inject()` — against a real, migrated Postgres, and asserts a golden-path
  # request succeeds. Exists specifically to catch the class of bug `.inject()`-only
  # tests are structurally blind to (the missing-`@fastify/static` boot crash, the
  # CORS gap) before it reaches a human or the acceptance/e2e tier.
  smoke:
    name: 'e2e: smoke (real /api/auth over HTTP)'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: steuereule
          POSTGRES_PASSWORD: steuereule
          POSTGRES_DB: steuereule
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U steuereule -d steuereule"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # Synthetic, dev-only values (ADR-0008/§4.2) — never real secrets. Production
      # requires both to be set explicitly (resolveGuestSessionSecret /
      # resolveFieldEncryptionKey refuse a guessable default under NODE_ENV=production).
      GUEST_SESSION_SECRET: ci-smoke-test-secret
      PRISMA_FIELD_ENCRYPTION_KEY: k1.aesgcm256.MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      PRISMA_FIELD_ENCRYPTION_HASH_SALT: ci-only-email-hash-salt
      # Synthetic, dev-only (ADR-0012) — same story as the two secrets above:
      # production requires both set explicitly (resolveBetterAuthSecret /
      # resolveBetterAuthUrl refuse a guessable default under NODE_ENV=production).
      BETTER_AUTH_SECRET: ci-smoke-test-better-auth-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      PORT: '3000'
      # The local Expo web dev origin (same value as apps/api/.env.example) — lets the
      # smoke request below send a real, allow-listed Origin so it can assert the
      # actual CORS response header, not just that the server answers (ADR-0011).
      CORS_ALLOWED_ORIGINS: http://localhost:8081
      # #241: no real reverse proxy in front of this job's server — declared
      # explicitly, same self-documenting reason as the two lines above.
      TRUSTED_PROXIES: none
      # #238/ADR-0024: declared explicitly for the same self-documenting reason as
      # BETTER_AUTH_URL above, even though it matches resolveWebAppUrl's dev fallback.
      WEB_APP_URL: http://localhost:8081
    steps:
      # Built here rather than written out in the job env, so no connection string with
      # credentials sits in the workflow; every later step reads it from the environment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/prepare-database
      - name: Build the API
        run: pnpm --filter @steuereule/api build
      - uses: ./.github/actions/install-chromium
        with:
          filter: '@steuereule/api'
      - name: Boot the real server
        # `node dist/main.js` alone cannot resolve `@steuereule/core` — it ships TS
        # source (`main: ./src/index.ts`, extensionless internal imports), so plain
        # Node's ESM resolver throws ERR_MODULE_NOT_FOUND. `--import tsx` is a bridge
        # for that packaging quirk (ADR-0010a), not the production answer — it still
        # boots the *compiled* `dist/`, so a real dist-wiring regression (the
        # `@fastify/static` class of bug) is still caught. See the PR notes: the
        # proper fix (give @steuereule/core a real build/exports map, or bundle the
        # API) is a forward-looking packaging decision, tracked as its own follow-up.
        working-directory: apps/api
        run: |
          node --import tsx dist/main.js > /tmp/steuereule-api-smoke.log 2>&1 &
          echo $! > /tmp/steuereule-api-smoke.pid
      - name: Smoke request — GET /v1/profile over real HTTP (poll, no sleep — ADR-0004)
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 1 --retry-all-errors --retry-connrefused \
            http://localhost:3000/v1/profile
      - name: Smoke request — GET /api/auth/get-session over real HTTP (ADR-0012 §1)
        # Proves better-auth's Fastify catch-all mount actually answers on the real,
        # booted server — the exact class of bug `.inject()` (light-my-request,
        # never a real socket) is structurally blind to: the content-type-parser
        # encapsulation wiring in mount-better-auth.ts only breaks when a real
        # request hits a real listening Fastify instance.
        #
        # Sends a real `Origin` header and asserts the echoed CORS header, not just a
        # 2xx: this route is `reply.hijack()`'d (mount-better-auth.ts), which bypasses
        # Fastify's `onSend` hook chain that `app.enableCors(...)` relies on elsewhere —
        # an Origin-less request would answer fine either way and could never catch
        # that class of regression on this one tier that boots the compiled `dist/`
        # over a real external socket (integration-tier coverage lives in
        # apps/api/test/acceptance/auth-mount-cors.test.ts).
        run: |
          headers=$(curl --fail --silent --show-error \
            --retry 30 --retry-delay 1 --retry-all-errors --retry-connrefused \
            -D - -o /dev/null \
            -H "Origin: ${CORS_ALLOWED_ORIGINS}" \
            http://localhost:3000/api/auth/get-session | tr -d '\r')
          echo "$headers"
          echo "$headers" | grep -qi "^access-control-allow-origin: ${CORS_ALLOWED_ORIGINS}$" || {
            echo "::error::Expected 'Access-Control-Allow-Origin: ${CORS_ALLOWED_ORIGINS}' on /api/auth/get-session for an allow-listed Origin — CORS regression on the hijacked better-auth mount (ADR-0011/ADR-0012 §1)."
            exit 1
          }
      - name: Smoke request — GET /v1/steuerjahre/2026/cockpit over real HTTP (REQ-001, steuereule#91)
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 1 --retry-all-errors --retry-connrefused \
            http://localhost:3000/v1/steuerjahre/2026/cockpit
      - name: Smoke request — REQ-011 DSGVO export, both formats, over real HTTP
        run: e2e/smoke/dsgvo-export.sh
      - name: Server log (on failure)
        if: failure()
        run: cat /tmp/steuereule-api-smoke.log || true
      - name: Stop the server
        if: always()
        run: |
          if [ -f /tmp/steuereule-api-smoke.pid ]; then
            kill "$(cat /tmp/steuereule-api-smoke.pid)" 2>/dev/null || true
          fi

  # Real gate (M2 CI-hardening) — automates the class of bug that broke the deployed
  # demo TWICE and was invisible to every unit/integration test and to `curl`/Node's own
  # `fetch()` (neither enforces CORS the way a browser does): #106 (the hijacked
  # better-auth mount silently dropping CORS headers on the real, non-OPTIONS response)
  # and #108 (`enableCors`'s default `methods` list silently excluding PUT, failing the
  # browser's real preflight). Both were only ever caught by Salih's manual cross-origin
  # Playwright pass — this job is that pass, automated and CI-blocking.
  #
  # Boots the compiled `dist/` API on one origin and serves the exported web bundle
  # (`expo export --platform web`) on a genuinely different origin (different port —
  # sufficient for the browser's same-origin policy, which keys on scheme+host+port),
  # then drives a real headless Chromium page (already-installed browser, ADR-0004) that
  # executes actual credentialed `fetch()` calls from the web origin at the API origin:
  # signup, get-session, sign-out, login, get-session again, and a PUT /v1/profile. Each
  # call is checked two ways — (a) the in-page fetch must actually resolve (a real
  # browser rejects the promise outright when CORS is broken, `net::ERR_FAILED`/"Failed
  # to fetch" — exactly how #106/#108 manifest to a real user) and (b) the actual wire
  # response is inspected via Playwright's network events for a genuine
  # `Access-Control-Allow-Origin: <web origin>` header, not merely inferred from the
  # fetch succeeding.
  #
  # See e2e/cross-origin/run.mjs for the full rationale/mechanics.
  #
  # Also runs the ADR-0014 responsive breakpoint gate (e2e/responsive/breakpoint-layout.mjs)
  # as an extra step below, rather than as its own job. That script needs exactly this
  # job's stack — a real, migrated Postgres, the compiled API booted and reachable, and
  # the exported web bundle statically served with EXPO_PUBLIC_API_BASE_URL baked in at
  # the same origin the script's flows drive (the #177 assertions sign a real guest and a
  # real account up through the running app) — so standing up a second full stack just to
  # run a second Playwright script would duplicate CI minutes for no isolation benefit;
  # nothing about the two scripts' assertions conflicts. Before this, the script existed
  # only as a local dev/CI-author tool nothing invoked in CI — ADR-0021's own defect
  # class (#197 found its `measureScreenMaxWidth` never reached a real screen either, for
  # the same reason).
  #
  # Historical gap, fixed by #201 (kept for the record — do not re-derive this from
  # memory, this paragraph used to describe a live gap and is now the closed account of
  # it): from when this script was first wired into CI until #201, the script's primary
  # locator, `[data-testid="screen-container"]`, never matched anything in the exported
  # build — react-native-web forwards a `testID` prop to `data-testid`, not a literal
  # `data-testid` prop, so every assertion fell through to the script's own div-scan
  # fallback. That fallback is what this job's own CI control proof (break
  # `EXPECTED_MAX_WIDTH.s`, watch the job go red; restore, watch it pass) exercised, and
  # what #197's *local* break/restore of `width: 100%` exercised — local by necessity,
  # since this job is what first ran the script in CI at all: #197's pipeline could not
  # have executed breakpoint-layout.mjs, full stop. The #177 button-fills-parent
  # assertions were observed green in CI (run 30425139957, commit `1668b3d`, carrying the
  # script content Kaan finalised at `950d524`) but never red in CI — only on a laptop;
  # they failed through the same `fail()` helper whose propagation that CI cycle proved.
  # #201 renamed the prop at all 25 call sites across the app's eight screens
  # (`data-testid="screen-container"` → `testID="screen-container"`), removed the
  # div-scan fallback (dead once the primary selector genuinely matches, and a risk of
  # masking the exact same class of regression if left in), and re-ran this job's
  # break/restore cycle against the corrected selector — this job is gated by the primary
  # selector now, not the fallback.
  # #223 adds two more steps below (`e2e/responsive/banner-ds-qa.mjs`,
  # `e2e/visibility/visibility-refetch.mjs`), promoting the manual proof already run on PRs
  # #215/#225 into a standing regression gate for REQ-005's "shown honestly" clause — the
  # unverified/verified banner on RegistrierungScreen and LoginScreen must be a LIVE read via the
  # shared `useEmailVerified` hook, never a value snapshotted and left stale. Two separate
  # scripts, not one (Musti's #223 ruling): a DS-fidelity regression (wrong banner colour/token)
  # and a mechanism regression (the banner never updates, or updates when it shouldn't) are
  # different failure modes and must not share one red/green signal. Both ride this job rather
  # than a new one for the same reason `breakpoint-layout.mjs` does — see the header comment
  # above.
  # The browser gates, split by topic (ADR-0112). They used to be one job of 69 steps that booted one stack and
  # ran every gate one after the other (about 40 minutes, and the first red gate hid every gate behind it).
  # Now: plan (the groups come from e2e/gates.json) -> build once -> one job per group on a fresh stack, in
  # parallel -> the aggregate job below, which keeps the old required check name.
  e2e-plan:
    name: 'e2e: plan (gate groups from e2e/gates.json)'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # This job needs Node only (the gate list is read with built-ins): without this, setup-node enables the
          # pnpm cache because package.json names pnpm, and fails because pnpm is not installed here.
          package-manager-cache: false
      - name: Validate the gate list and build the group matrix
        id: plan
        run: |
          node e2e/run-gates.mjs --check
          echo "matrix=$(node e2e/run-gates.mjs --matrix)" >> "$GITHUB_OUTPUT"

  e2e-build:
    name: 'e2e: build (API + web bundle for the gate groups)'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Baked into the static web export: the browser calls the API origin the group jobs boot.
      EXPO_PUBLIC_API_BASE_URL: http://localhost:3301
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - name: Generate Prisma Client (the API build compiles against it)
        run: pnpm --filter @steuereule/api prisma:generate
      - name: Build the API
        run: pnpm --filter @steuereule/api build
      - name: Export the web bundle (offline/static web build, EXPO_PUBLIC_* baked in)
        run: pnpm --filter @steuereule/mobile-web exec expo export --platform web
      # One tarball, not two paths: upload-artifact roots a multi-path artifact at the paths' common ancestor,
      # which would move apps/api/dist and apps/mobile-web/dist.
      - name: Pack the build
        run: tar czf e2e-build.tgz apps/api/dist apps/mobile-web/dist
      - name: Upload the build for the gate groups
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-build
          path: e2e-build.tgz
          retention-days: 1
          if-no-files-found: error

  e2e-gates:
    name: 'e2e: gates — ${{ matrix.group }}'
    needs: [e2e-plan, e2e-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      # Every group reports on its own: a red group must not cancel the others.
      fail-fast: false
      matrix: ${{ fromJSON(needs.e2e-plan.outputs.matrix) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: steuereule
          POSTGRES_PASSWORD: steuereule
          POSTGRES_DB: steuereule
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U steuereule -d steuereule"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      GUEST_SESSION_SECRET: ci-cross-origin-smoke-secret
      PRISMA_FIELD_ENCRYPTION_KEY: k1.aesgcm256.MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      PRISMA_FIELD_ENCRYPTION_HASH_SALT: ci-only-email-hash-salt
      BETTER_AUTH_SECRET: ci-cross-origin-smoke-better-auth-secret-0123456789
      # The two origins are genuinely distinct (different ports — different from the
      # `smoke` job's :3000/:8081 pair on purpose, so a reader never conflates the two
      # jobs' server instances).
      API_ORIGIN: http://localhost:3301
      WEB_ORIGIN: http://localhost:4173
      BETTER_AUTH_URL: http://localhost:3301
      PORT: '3301'
      CORS_ALLOWED_ORIGINS: http://localhost:4173
      # #241: no real reverse proxy in front of this job's server either.
      TRUSTED_PROXIES: none
      # #238/ADR-0024: the real web app origin in this job — WEB_ORIGIN above, not
      # BETTER_AUTH_URL/API_ORIGIN — so the device-authorization QR (if exercised here)
      # would point at the actually-served static export, not the API.
      WEB_APP_URL: http://localhost:4173
      # #450 5C / D7: the test unlock (a fake payment provider, only ever outside production and without
      # Stripe keys) so the printout gate can pay and download without Stripe.
      PAYMENT_FAKE_PROVIDER: '1'
      # ADR-0065: a handful of streets so the address search answers in this job (smart inputs gate).
      # Production data is fetched with `streets:fetch`; this fixture never leaves the test jobs.
      STREET_DATA_PATH: ${{ github.workspace }}/e2e/fixtures/streets.sample.csv
      EXPO_PUBLIC_API_BASE_URL: http://localhost:3301
      # ADR-0101 §20: the self-employment switch is on by default; these scenarios pin the Gewerbe-Gate path
      # (scenario 09 and the dialog matrices). Scenario 09b needs a switch-on stack of its own.
      SELBSTSTAENDIGE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/prepare-database
        if: matrix.stack
      - name: Download the build
        if: matrix.stack
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-build
      - name: Unpack the build
        if: matrix.stack
        run: tar xzf e2e-build.tgz
      # A control-proof entry of the matrix (e2e/control-proofs.json): plant the regression in the API source and
      # rebuild the API over the downloaded build, so the stack below is the mutant. The working tree of this job is
      # thrown away with the runner; nothing of it is committed or uploaded as a build.
      - name: Apply the mutation and rebuild the API (control proof only)
        if: matrix.mutant
        env:
          MUTANT: ${{ matrix.mutant }}
        run: |
          node e2e/run-control-proofs.mjs --apply "$MUTANT"
          pnpm --filter @steuereule/api build
      - uses: ./.github/actions/install-chromium
        if: matrix.stack
      - name: Boot the real server (compiled dist/, same tsx bridge as the `smoke` job)
        if: matrix.stack
        working-directory: apps/api
        env:
          # The scripted chat model (#450 D8) — only the group that needs it; it is refused in production.
          AI_FAKE_KI: ${{ matrix.fake_ki && '1' || '' }}
        run: |
          node --import tsx dist/main.js > /tmp/steuereule-api-cross-origin.log 2>&1 &
          echo $! > /tmp/steuereule-api-cross-origin.pid
      - name: Serve the exported web bundle on its own origin
        if: matrix.stack
        run: |
          node e2e/cross-origin/static-server.mjs --root apps/mobile-web/dist --port 4173 --host localhost \
            > /tmp/steuereule-web-cross-origin.log 2>&1 &
          echo $! > /tmp/steuereule-web-cross-origin.pid
      - name: Wait for both origins to answer (poll, no sleep)
        if: matrix.stack
        run: |
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors --retry-connrefused \
            "${API_ORIGIN}/v1/profile"
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors --retry-connrefused \
            "${WEB_ORIGIN}/"
      - name: Run the gates of the group — ${{ matrix.title }}
        if: '!matrix.mutant'
        run: node e2e/run-gates.mjs --group "${{ matrix.group }}"
      # Passes only when the named gate FAILS on the mutant with its expected message (ADR-0021).
      - name: The gate must fail on the mutant — ${{ matrix.title }}
        if: matrix.mutant
        env:
          MUTANT: ${{ matrix.mutant }}
        run: node e2e/run-control-proofs.mjs --run "$MUTANT"
      # The reports some gates write (visual diffs, scan corpus, coverage gaps, navigation measurements); only the
      # group that ran the gate has files, the others upload nothing.
      - name: Upload the gate reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports-${{ matrix.group }}
          path: |
            /tmp/visual-regression
            /tmp/scan-corpus
            /tmp/e2e-coverage
            /tmp/navigation-efficiency
          if-no-files-found: ignore
      - name: API log (on failure)
        if: failure() && matrix.stack
        run: cat /tmp/steuereule-api-cross-origin.log || true
      - name: Web static server log (on failure)
        if: failure() && matrix.stack
        run: cat /tmp/steuereule-web-cross-origin.log || true
      - name: Stop the servers (PID-scoped only — #114, never a blanket process kill)
        if: always() && matrix.stack
        run: |
          if [ -f /tmp/steuereule-api-cross-origin.pid ]; then
            kill "$(cat /tmp/steuereule-api-cross-origin.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/steuereule-web-cross-origin.pid ]; then
            kill "$(cat /tmp/steuereule-web-cross-origin.pid)" 2>/dev/null || true
          fi

  # The required check keeps its name (a repository ruleset pins the name; a renamed job would wait for ever and
  # the PR would sit on "pending"). It passes when the plan, the build and every gate group passed, and it runs
  # even when one of them failed, so it reports red instead of staying pending. `!cancelled()`, not `always()`:
  # a newer push cancels this run, and with `always()` the job still ran and reported the cancelled gate groups
  # as a failure (seen on #586, run 45816324949).
  cross-origin-smoke:
    name: 'e2e: browser gates & a11y (BFSG/WCAG 2.1 AA, headless Chromium)'
    needs: [e2e-plan, e2e-build, e2e-gates]
    if: '!cancelled()'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Plan, build and every gate group passed
        env:
          PLAN: ${{ needs.e2e-plan.result }}
          BUILD: ${{ needs.e2e-build.result }}
          GATES: ${{ needs.e2e-gates.result }}
        run: |
          echo "plan: $PLAN, build: $BUILD, gate groups: $GATES"
          test "$PLAN" = success && test "$BUILD" = success && test "$GATES" = success

  e2e-scenarios:
    # One job per scenario group, named after what it covers (e2e/scenarios/scenario-groups.mjs; the keys and
    # titles here must match it, scenario-groups.test.mjs checks that). The names are required checks in the
    # main ruleset: rename a group there too.
    name: 'e2e: scenarios — ${{ matrix.title }}'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: employees-families
            title: 'employees & families'
          - group: cross-border-ch
            title: 'cross-border CH'
          - group: capital-pensions-self-employed
            title: 'capital, pensions & self-employed'
          - group: navigation-dialogs-chat
            title: 'navigation, dialogs & chat'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: steuereule
          POSTGRES_PASSWORD: steuereule
          POSTGRES_DB: steuereule
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U steuereule -d steuereule"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      GUEST_SESSION_SECRET: ci-e2e-shard-secret
      PRISMA_FIELD_ENCRYPTION_KEY: k1.aesgcm256.MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      PRISMA_FIELD_ENCRYPTION_HASH_SALT: ci-only-email-hash-salt
      BETTER_AUTH_SECRET: ci-e2e-shard-better-auth-secret-0123456789
      API_ORIGIN: http://localhost:3301
      WEB_ORIGIN: http://localhost:4173
      BETTER_AUTH_URL: http://localhost:3301
      PORT: '3301'
      CORS_ALLOWED_ORIGINS: http://localhost:4173
      TRUSTED_PROXIES: none
      WEB_APP_URL: http://localhost:4173
      EXPO_PUBLIC_API_BASE_URL: http://localhost:3301
      # ADR-0101 §20: the switch is on by default; the shards pin the Gewerbe-Gate path of scenario 09.
      SELBSTSTAENDIGE_ENABLED: 'false'
    steps:
      # Built here rather than written out in the job env, so no connection string with
      # credentials sits in the workflow; every later step reads it from the environment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/prepare-database
        with:
          drift: 'false'
      - name: Build the API
        run: pnpm --filter @steuereule/api build
      - name: Export the web bundle
        run: pnpm --filter @steuereule/mobile-web exec expo export --platform web
      - uses: ./.github/actions/install-chromium
      - name: Boot the real API server
        working-directory: apps/api
        run: |
          node --import tsx dist/main.js > /tmp/steuereule-api-shard.log 2>&1 &
          echo $! > /tmp/steuereule-api-shard.pid
      - name: Serve the exported web bundle
        run: |
          node e2e/cross-origin/static-server.mjs --root apps/mobile-web/dist --port 4173 --host localhost \
            > /tmp/steuereule-web-shard.log 2>&1 &
          echo $! > /tmp/steuereule-web-shard.pid
      - name: Wait for both origins to answer
        run: |
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors --retry-connrefused \
            "${API_ORIGIN}/v1/profile"
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors --retry-connrefused \
            "${WEB_ORIGIN}/"
      - name: Run the scenario group ${{ matrix.title }}
        run: node e2e/scenarios/run-all-scenarios.mjs --group "${{ matrix.group }}"
      - name: API log (on failure)
        if: failure()
        run: cat /tmp/steuereule-api-shard.log || true
      - name: Stop servers
        if: always()
        run: |
          if [ -f /tmp/steuereule-api-shard.pid ]; then
            kill "$(cat /tmp/steuereule-api-shard.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/steuereule-web-shard.pid ]; then
            kill "$(cat /tmp/steuereule-web-shard.pid)" 2>/dev/null || true
          fi

  # Scenario 09b (ADR-0101): the self-employment area with the switch on, as the app runs by default since
  # 20.11.2026 — profile, quick entry, book, bank import, assets, closing, VAT, trade tax, ELSTER fill-in help,
  # export, checkout and the §22 additions. Its own stack, because the shards pin the switch off.
  e2e-self-employed:
    name: 'e2e: scenario 09b (self-employment switch on)'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: steuereule
          POSTGRES_PASSWORD: steuereule
          POSTGRES_DB: steuereule
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U steuereule -d steuereule"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      GUEST_SESSION_SECRET: ci-e2e-09b-secret
      PRISMA_FIELD_ENCRYPTION_KEY: k1.aesgcm256.MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      PRISMA_FIELD_ENCRYPTION_HASH_SALT: ci-only-email-hash-salt
      BETTER_AUTH_SECRET: ci-e2e-09b-better-auth-secret-0123456789
      API_ORIGIN: http://localhost:3301
      WEB_ORIGIN: http://localhost:4173
      BETTER_AUTH_URL: http://localhost:3301
      PORT: '3301'
      CORS_ALLOWED_ORIGINS: http://localhost:4173
      TRUSTED_PROXIES: none
      WEB_APP_URL: http://localhost:4173
      EXPO_PUBLIC_API_BASE_URL: http://localhost:3301
      # ADR-0101 §20: the default of the app. Scenario 09b walks the self-employment area end to end; the
      # shards above pin the switch off for scenario 09, so 09b gets this stack of its own (ATTACH mode).
      SELBSTSTAENDIGE_ENABLED: 'true'
      # #450 D7: the fake payment provider (refused in production, no Stripe keys here), so 09b pays the
      # self-employment tier through the real checkout and webhook (e2e/harness/fake-payment.mjs).
      PAYMENT_FAKE_PROVIDER: '1'
    steps:
      # Built here rather than written out in the job env, so no connection string with
      # credentials sits in the workflow; every later step reads it from the environment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/prepare-database
        with:
          drift: 'false'
      - name: Build the API
        run: pnpm --filter @steuereule/api build
      - name: Export the web bundle
        run: pnpm --filter @steuereule/mobile-web exec expo export --platform web
      - uses: ./.github/actions/install-chromium
      - name: Boot the real API server
        working-directory: apps/api
        run: |
          node --import tsx dist/main.js > /tmp/steuereule-api-09b.log 2>&1 &
          echo $! > /tmp/steuereule-api-09b.pid
      - name: Serve the exported web bundle
        run: |
          node e2e/cross-origin/static-server.mjs --root apps/mobile-web/dist --port 4173 --host localhost \
            > /tmp/steuereule-web-09b.log 2>&1 &
          echo $! > /tmp/steuereule-web-09b.pid
      - name: Wait for both origins to answer
        run: |
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors --retry-connrefused \
            "${API_ORIGIN}/v1/profile"
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors --retry-connrefused \
            "${WEB_ORIGIN}/"
      - name: Run scenario 09b
        run: node e2e/scenarios/09b-maximiliane-koch-selbststaendig.mjs
      - name: Beta self-employment states — businesses, books, E-Bilanz and § 16 fail and recover; a lost session leads back
        run: node e2e/forms/beta-business-states.mjs
      - name: Beta ELSTER-help states — price, pending and paid checkout, payment time-out, unconfirmed take-over
        run: node e2e/submission/beta-elster-states.mjs
      - name: API log (on failure)
        if: failure()
        run: cat /tmp/steuereule-api-09b.log || true
      - name: Stop servers
        if: always()
        run: |
          if [ -f /tmp/steuereule-api-09b.pid ]; then
            kill "$(cat /tmp/steuereule-api-09b.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/steuereule-web-09b.pid ]; then
            kill "$(cat /tmp/steuereule-web-09b.pid)" 2>/dev/null || true
          fi

  # Real gate (#76) — the stakeholder's own bug report, automated: builds and boots the ACTUAL
  # docker-compose.prod.yml stack (real apps/api/Dockerfile + apps/mobile-web/Dockerfile, a real
  # `docker compose build`, the real container boot order: postgres -> migrate -> api, web
  # independently) — not a hand-typed re-derivation of that stack the way `smoke`/
  # `cross-origin-smoke` boot their own processes directly on the runner. Green here is the claim
  # "the shipped production images serve a working sign-in", which is a DIFFERENT claim from "the
  # individual pieces work" — the stakeholder's own local run is proof the two can diverge; see
  # e2e/prod-deploy/run.mjs's own header comment for the exact class of bug this closes.
  #
  # Uses the SAME .env.example the stakeholder himself copies locally (`cp .env.example .env`) —
  # one file, one set of values for what gets BUILT (the compose stack, the images, every
  # secret/origin baked into them). Musti's #274 review, F3: the readiness `curl`s and the
  # "Guest, registration, login, QR" step's own API_ORIGIN/WEB_ORIGIN below are DELIBERATELY
  # hardcoded literals, not re-derived from .env.example's values, even though they happen to
  # match its defaults today — corrected here because the comment used to claim otherwise. This
  # is load-bearing, not an oversight: #274's own ADR-0021 control proof (break .env.example's
  # API_ORIGIN, watch this job go red) depends on this job's OWN probes staying pointed at the
  # real, fixed ports regardless of what .env.example says, so a bundle-side break (the wrong
  # origin baked into the web image) is isolated and named, rather than the harness quietly
  # re-pointing itself at whatever the broken value was and never noticing the mismatch.
  prod-stack-smoke:
    name: 'e2e: production stack smoke (real Docker build)'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/install-chromium
      - uses: ./.github/actions/boot-prod-stack
      - name: Calibrate what the smoke run is allowed to CLAIM it ran against (ADR-0021 §3)
        # run.mjs's PASS lines used to hardcode the word "containerised" — a claim about the far
        # end of an HTTP origin that an ATTACHING script cannot see, measured false on a machine
        # with no Docker daemon at all and true here only by CI's own coincidence of running
        # `docker compose up` first. The phrase is now derived from `docker compose ps`, and this
        # step is what stops that derivation from silently collapsing back into a constant: it
        # feeds known-good and known-bad inputs through it and fails if they stop differing.
        # Placed AFTER the stack is up so its trailing live-probe line reads the real project —
        # the one environment where the confirmed branch is exercised against real docker output.
        env:
          API_ORIGIN: http://localhost:3000
        run: node e2e/prod-deploy/api-target.mjs
      - name: Guest, registration, login, QR — real browser against the real containers
        # API_ORIGIN/WEB_ORIGIN deliberately hardcoded, not read from the copied .env — see this
        # job's own header comment (Musti's #274 review, F3) for why that isolation matters.
        env:
          API_ORIGIN: http://localhost:3000
          WEB_ORIGIN: http://localhost:8080
          DB_USER: steuereule
          DB_PASSWORD: steuereule
          DB_NAME: steuereule
        run: DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@localhost:5432/${DB_NAME}" node e2e/prod-deploy/run.mjs
      - name: Mailpit's SMTP port speaks TLS with the certificate of the local CA
        # Fails if the port answers in clear text or with a certificate the CA did not sign for 127.0.0.1.
        run: openssl s_client -connect 127.0.0.1:1025 -CAfile .local/mail-tls/ca/ca.pem -verify_ip 127.0.0.1 -verify_return_error -brief </dev/null
      - name: Registration mail reached the local inbox (Mailpit, SMTP over TLS)
        # The API has no clear-text path, so a mail in the inbox went over TLS with a verified certificate.
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-all-errors \
            "http://localhost:8025/api/v1/message/latest" | grep -q 'verify-email'
      - name: REQ-011 PDF export — real HTTP against the built apps/api/Dockerfile container
        run: e2e/prod-deploy/pdf-export-smoke.sh
      - name: Container logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --no-color
      - name: Tear down (always — never leave a built stack/volume behind on this runner)
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v

  prod-stack-dast:
    name: 'e2e: OWASP ZAP DAST (real Docker build)'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/boot-prod-stack
      - name: OWASP ZAP Baseline & OpenAPI DAST Pentest against production containers
        run: scripts/ci/zap-dast.sh
      - name: Container logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --no-color
      - name: Tear down (always — never leave a built stack/volume behind on this runner)
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v

  # The required check keeps its name: a repository ruleset pins the name, and a renamed job would wait
  # for ever. It passes when both halves of the former single job passed.
  prod-deploy-smoke:
    name: 'e2e: production compose stack + OWASP ZAP DAST (real Docker build)'
    needs: [prod-stack-smoke, prod-stack-dast]
    # As for the browser-gates aggregator above: red after a failure, not after a cancelled run.
    if: '!cancelled()'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Both halves passed
        env:
          SMOKE: ${{ needs.prod-stack-smoke.result }}
          DAST: ${{ needs.prod-stack-dast.result }}
        run: |
          echo "production stack smoke: $SMOKE, OWASP ZAP DAST: $DAST"
          test "$SMOKE" = success && test "$DAST" = success
