# Baseline CI pipeline (Steuereule).
#
# The Docker Compose files (docker-compose.yml + the ci/e2e overlays) are the
# foundation this pipeline is built on. `lint` and `build` are still honest
# placeholders (grow as lintable/buildable-image work lands); `test`, `integration`,
# `smoke` and `cross-origin-smoke` are real, CI-blocking gates.
#
# Flow:  validate-compose ──► lint ──────────────► build ──► smoke
#                          ├─► test ───────────────┤    └─► cross-origin-smoke
#                          └─► integration ─────────┘
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One in-flight run per ref; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Real gate today: the three compose file combinations must parse.
  validate-compose:
    name: Validate compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: base
        run: docker compose -f docker-compose.yml config
      - name: base + ci overlay
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml config
      - name: base + e2e overlay
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml config

  # Placeholder — wire up eslint/prettier here once the app packages land.
  lint:
    name: Lint
    needs: validate-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lint (placeholder)
        run: |
          echo "TODO — no lintable packages yet; baseline is empty."

  # Real gate: typecheck and test every workspace package in the monorepo (no-DB
  # unit/pure-logic suite — DB-requiring tests live in the `integration` job below,
  # ADR-0004).
  test:
    name: Test
    needs: validate-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm --filter @steuereule/api prisma:generate
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test
        run: pnpm -r test

  # Real gate (#66, extended for Slice 2/ADR-0012): proves the DSGVO-critical
  # guarantees — REQ-003 field-encryption at rest, REQ-004 append-only audit log,
  # and now REQ-005/006/009/010's auth acceptance suites (email/password signup +
  # verification, session/guard precedence, guest->account upgrade, security
  # hardening) — against a real, migrated Postgres, not just the no-DB unit suite.
  # A GitHub Actions service container (rather than docker-compose) because the test
  # process runs natively on the runner (ADR-0010) — the compose stack's `postgres`
  # service is the parity image for the *local*/e2e stack, not this job's database.
  integration:
    name: Integration (Postgres)
    needs: validate-compose
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: steuereule
          POSTGRES_PASSWORD: steuereule
          POSTGRES_DB: steuereule
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U steuereule -d steuereule"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://steuereule:steuereule@localhost:5432/steuereule
      # Synthetic, dev-only (ADR-0012) — vitest.integration.config.ts already sets
      # these for the test process, but declared here too for the same reason
      # DATABASE_URL is: this job's env is meant to be self-documenting about what
      # it actually exercises.
      BETTER_AUTH_SECRET: ci-integration-test-better-auth-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm --filter @steuereule/api prisma:generate
      - name: Apply migrations (migrate deploy, never migrate dev)
        run: pnpm --filter @steuereule/api migrate:deploy
      - name: Integration + acceptance tests — encryption/audit + REQ-005/006/009/010 (ADR-0012)
        run: pnpm --filter @steuereule/api test:integration

  # Placeholder — build the service images once Dockerfiles exist.
  build:
    name: Build
    needs: [lint, test, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build (placeholder)
        run: |
          echo "TODO — no images to build yet; baseline is empty."

  # Real gate (#69): boots the actual compiled server over real HTTP — not
  # `.inject()` — against a real, migrated Postgres, and asserts a golden-path
  # request succeeds. Exists specifically to catch the class of bug `.inject()`-only
  # tests are structurally blind to (the missing-`@fastify/static` boot crash, the
  # CORS gap) before it reaches a human or the acceptance/e2e tier.
  smoke:
    name: Smoke
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: steuereule
          POSTGRES_PASSWORD: steuereule
          POSTGRES_DB: steuereule
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U steuereule -d steuereule"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://steuereule:steuereule@localhost:5432/steuereule
      # Synthetic, dev-only values (ADR-0008/§4.2) — never real secrets. Production
      # requires both to be set explicitly (resolveGuestSessionSecret /
      # resolveFieldEncryptionKey refuse a guessable default under NODE_ENV=production).
      GUEST_SESSION_SECRET: ci-smoke-test-secret
      PRISMA_FIELD_ENCRYPTION_KEY: k1.aesgcm256.MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      # Synthetic, dev-only (ADR-0012) — same story as the two secrets above:
      # production requires both set explicitly (resolveBetterAuthSecret /
      # resolveBetterAuthUrl refuse a guessable default under NODE_ENV=production).
      BETTER_AUTH_SECRET: ci-smoke-test-better-auth-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      PORT: '3000'
      # The local Expo web dev origin (same value as apps/api/.env.example) — lets the
      # smoke request below send a real, allow-listed Origin so it can assert the
      # actual CORS response header, not just that the server answers (ADR-0011).
      CORS_ALLOWED_ORIGINS: http://localhost:8081
    steps:
      - uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm --filter @steuereule/api prisma:generate
      - name: Apply migrations (migrate deploy, never migrate dev)
        run: pnpm --filter @steuereule/api migrate:deploy
      - name: Build the API
        run: pnpm --filter @steuereule/api build
      - name: Boot the real server
        # `node dist/main.js` alone cannot resolve `@steuereule/core` — it ships TS
        # source (`main: ./src/index.ts`, extensionless internal imports), so plain
        # Node's ESM resolver throws ERR_MODULE_NOT_FOUND. `--import tsx` is a bridge
        # for that packaging quirk (ADR-0010a), not the production answer — it still
        # boots the *compiled* `dist/`, so a real dist-wiring regression (the
        # `@fastify/static` class of bug) is still caught. See the PR notes: the
        # proper fix (give @steuereule/core a real build/exports map, or bundle the
        # API) is a forward-looking packaging decision, tracked as its own follow-up.
        working-directory: apps/api
        run: |
          node --import tsx dist/main.js > /tmp/steuereule-api-smoke.log 2>&1 &
          echo $! > /tmp/steuereule-api-smoke.pid
      - name: Smoke request — GET /v1/profile over real HTTP (poll, no sleep — ADR-0004)
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 1 --retry-all-errors --retry-connrefused \
            http://localhost:3000/v1/profile
      - name: Smoke request — GET /api/auth/get-session over real HTTP (ADR-0012 §1)
        # Proves better-auth's Fastify catch-all mount actually answers on the real,
        # booted server — the exact class of bug `.inject()` (light-my-request,
        # never a real socket) is structurally blind to: the content-type-parser
        # encapsulation wiring in mount-better-auth.ts only breaks when a real
        # request hits a real listening Fastify instance.
        #
        # Sends a real `Origin` header and asserts the echoed CORS header, not just a
        # 2xx: this route is `reply.hijack()`'d (mount-better-auth.ts), which bypasses
        # Fastify's `onSend` hook chain that `app.enableCors(...)` relies on elsewhere —
        # an Origin-less request would answer fine either way and could never catch
        # that class of regression on this one tier that boots the compiled `dist/`
        # over a real external socket (integration-tier coverage lives in
        # apps/api/test/acceptance/auth-mount-cors.test.ts).
        run: |
          headers=$(curl --fail --silent --show-error \
            --retry 30 --retry-delay 1 --retry-all-errors --retry-connrefused \
            -D - -o /dev/null \
            -H "Origin: ${CORS_ALLOWED_ORIGINS}" \
            http://localhost:3000/api/auth/get-session | tr -d '\r')
          echo "$headers"
          echo "$headers" | grep -qi "^access-control-allow-origin: ${CORS_ALLOWED_ORIGINS}$" || {
            echo "::error::Expected 'Access-Control-Allow-Origin: ${CORS_ALLOWED_ORIGINS}' on /api/auth/get-session for an allow-listed Origin — CORS regression on the hijacked better-auth mount (ADR-0011/ADR-0012 §1)."
            exit 1
          }
      - name: Server log (on failure)
        if: failure()
        run: cat /tmp/steuereule-api-smoke.log || true
      - name: Stop the server
        if: always()
        run: |
          if [ -f /tmp/steuereule-api-smoke.pid ]; then
            kill "$(cat /tmp/steuereule-api-smoke.pid)" 2>/dev/null || true
          fi

  # Real gate (M2 CI-hardening) — automates the class of bug that broke the deployed
  # demo TWICE and was invisible to every unit/integration test and to `curl`/Node's own
  # `fetch()` (neither enforces CORS the way a browser does): #106 (the hijacked
  # better-auth mount silently dropping CORS headers on the real, non-OPTIONS response)
  # and #108 (`enableCors`'s default `methods` list silently excluding PUT, failing the
  # browser's real preflight). Both were only ever caught by Salih's manual cross-origin
  # Playwright pass — this job is that pass, automated and CI-blocking.
  #
  # Boots the compiled `dist/` API on one origin and serves the exported web bundle
  # (`expo export --platform web`) on a genuinely different origin (different port —
  # sufficient for the browser's same-origin policy, which keys on scheme+host+port),
  # then drives a real headless Chromium page (already-installed browser, ADR-0004) that
  # executes actual credentialed `fetch()` calls from the web origin at the API origin:
  # signup, get-session, sign-out, login, get-session again, and a PUT /v1/profile. Each
  # call is checked two ways — (a) the in-page fetch must actually resolve (a real
  # browser rejects the promise outright when CORS is broken, `net::ERR_FAILED`/"Failed
  # to fetch" — exactly how #106/#108 manifest to a real user) and (b) the actual wire
  # response is inspected via Playwright's network events for a genuine
  # `Access-Control-Allow-Origin: <web origin>` header, not merely inferred from the
  # fetch succeeding.
  #
  # See e2e/cross-origin/run.mjs for the full rationale/mechanics.
  cross-origin-smoke:
    name: Cross-origin browser smoke
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: steuereule
          POSTGRES_PASSWORD: steuereule
          POSTGRES_DB: steuereule
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U steuereule -d steuereule"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://steuereule:steuereule@localhost:5432/steuereule
      GUEST_SESSION_SECRET: ci-cross-origin-smoke-secret
      PRISMA_FIELD_ENCRYPTION_KEY: k1.aesgcm256.MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      BETTER_AUTH_SECRET: ci-cross-origin-smoke-better-auth-secret-0123456789
      # The two origins are genuinely distinct (different ports — different from the
      # `smoke` job's :3000/:8081 pair on purpose, so a reader never conflates the two
      # jobs' server instances).
      API_ORIGIN: http://localhost:3301
      WEB_ORIGIN: http://localhost:4173
      BETTER_AUTH_URL: http://localhost:3301
      PORT: '3301'
      CORS_ALLOWED_ORIGINS: http://localhost:4173
      EXPO_PUBLIC_API_BASE_URL: http://localhost:3301
    steps:
      - uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm --filter @steuereule/api prisma:generate
      - name: Apply migrations (migrate deploy, never migrate dev)
        run: pnpm --filter @steuereule/api migrate:deploy
      - name: Build the API
        run: pnpm --filter @steuereule/api build
      - name: Export the web bundle (offline/static web build, EXPO_PUBLIC_* baked in)
        run: pnpm --filter @steuereule/mobile-web exec expo export --platform web
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright's Chromium (browser only, no OS deps re-check needed on ubuntu-latest's image)
        # e2e only depends on `playwright-core` (the library the smoke script actually
        # imports — no test-runner needed), whose registered bin is named
        # `playwright-core`, not `playwright`. `pnpm exec playwright ...` resolves bins
        # by their registered name, so it fails with "Command \"playwright\" not found"
        # even though the package is installed (#120 CI run). `playwright-core`'s CLI
        # ships the same `install` subcommand as the `playwright` package's CLI.
        run: pnpm --filter @steuereule/e2e exec playwright-core install chromium --with-deps
      - name: Boot the real server (compiled dist/, same tsx bridge as the `smoke` job)
        working-directory: apps/api
        run: |
          node --import tsx dist/main.js > /tmp/steuereule-api-cross-origin.log 2>&1 &
          echo $! > /tmp/steuereule-api-cross-origin.pid
      - name: Serve the exported web bundle on its own origin
        run: |
          node e2e/cross-origin/static-server.mjs --root apps/mobile-web/dist --port 4173 --host localhost \
            > /tmp/steuereule-web-cross-origin.log 2>&1 &
          echo $! > /tmp/steuereule-web-cross-origin.pid
      - name: Wait for both origins to answer (poll, no sleep)
        run: |
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors --retry-connrefused \
            "${API_ORIGIN}/v1/profile"
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors --retry-connrefused \
            "${WEB_ORIGIN}/"
      - name: Cross-origin browser smoke — signup, login, get-session, PUT /v1/profile
        run: node e2e/cross-origin/run.mjs
      - name: API log (on failure)
        if: failure()
        run: cat /tmp/steuereule-api-cross-origin.log || true
      - name: Web static server log (on failure)
        if: failure()
        run: cat /tmp/steuereule-web-cross-origin.log || true
      - name: Stop the servers (PID-scoped only — #114, never a blanket process kill)
        if: always()
        run: |
          if [ -f /tmp/steuereule-api-cross-origin.pid ]; then
            kill "$(cat /tmp/steuereule-api-cross-origin.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/steuereule-web-cross-origin.pid ]; then
            kill "$(cat /tmp/steuereule-web-cross-origin.pid)" 2>/dev/null || true
          fi
