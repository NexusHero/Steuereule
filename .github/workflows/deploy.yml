# Beta deployment to Google Cloud Run (ADR-0053). Runs after a green CI on main; until the
# GCP_* repository variables exist, the deploy job skips with a named notice.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

concurrency:
  group: deploy-beta
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION || 'europe-west4' }}

jobs:
  validate:
    name: OpenTofu validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.0"
      - name: Validate infra/gcp and infra/terraform
        run: |
          for dir in infra/gcp infra/terraform; do
            (cd "$dir" && tofu init -backend=false -input=false && tofu validate)
          done
          tofu fmt -check -recursive infra/gcp

  deploy:
    name: Deploy beta (Cloud Run)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: beta
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      TRUSTED_PROXIES: ${{ vars.TRUSTED_PROXIES || '169.254.0.0/16' }}
      SQL_INSTANCE: ${{ vars.GCP_SQL_INSTANCE }}
      API_SA: ${{ vars.GCP_RUNTIME_SA }}
      WEB_SA: ${{ vars.GCP_WEB_SA }}
    steps:
      - name: Configuration gate
        id: gate
        run: |
          missing=""
          for name in GCP_PROJECT_ID GCP_WIF_PROVIDER GCP_DEPLOYER_SA GCP_RUNTIME_SA GCP_WEB_SA GCP_SQL_INSTANCE APP_DOMAIN EMAIL_FROM; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Repository variables missing:$missing — run scripts/infra/gcp-setup.sh first."
              exit 1
            fi
            echo "::notice::Beta deployment not configured yet (missing:$missing) — skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}
          GCP_RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
          GCP_WEB_SA: ${{ vars.GCP_WEB_SA }}
          GCP_SQL_INSTANCE: ${{ vars.GCP_SQL_INSTANCE }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: google-github-actions/auth@v2
        if: steps.gate.outputs.ready == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.gate.outputs.ready == 'true'

      - name: Resolve images and origins
        if: steps.gate.outputs.ready == 'true'
        run: |
          registry="$REGION-docker.pkg.dev/$PROJECT_ID/steuereule"
          tag="$(git rev-parse --short=12 HEAD)"
          {
            echo "API_IMAGE=$registry/api:$tag"
            echo "WEB_IMAGE=$registry/web:$tag"
            echo "API_ORIGIN=https://api.$APP_DOMAIN"
            echo "WEB_ORIGIN=https://www.$APP_DOMAIN"
          } >> "$GITHUB_ENV"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push API image
        if: steps.gate.outputs.ready == 'true'
        run: |
          docker build -f apps/api/Dockerfile -t "$API_IMAGE" .
          docker push "$API_IMAGE"

      - name: Collect secrets that have a value
        if: steps.gate.outputs.ready == 'true'
        run: |
          secrets=""
          for name in DATABASE_URL GUEST_SESSION_SECRET PRISMA_FIELD_ENCRYPTION_KEY BETTER_AUTH_SECRET BREVO_API_KEY \
                      GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET; do
            if [ -n "$(gcloud secrets versions list "$name" --filter=state=enabled --limit=1 --format='value(name)')" ]; then
              secrets="$secrets,$name=$name:latest"
            fi
          done
          for required in DATABASE_URL GUEST_SESSION_SECRET PRISMA_FIELD_ENCRYPTION_KEY BETTER_AUTH_SECRET BREVO_API_KEY; do
            case "$secrets," in
              *",$required="*) ;;
              *) echo "::error::Secret $required has no enabled version — run scripts/infra/gcp-setup.sh."; exit 1 ;;
            esac
          done
          echo "API_SECRETS=${secrets#,}" >> "$GITHUB_ENV"

      - name: Capture current Cloud Run revisions for rollback safety
        if: steps.gate.outputs.ready == 'true'
        run: |
          prev_api="$(gcloud run services describe steuereule-api --region "$REGION" --format='value(status.latestReadyRevisionName)' 2>/dev/null || true)"
          prev_web="$(gcloud run services describe steuereule-web --region "$REGION" --format='value(status.latestReadyRevisionName)' 2>/dev/null || true)"
          echo "PREV_API_REVISION=$prev_api" >> "$GITHUB_ENV"
          echo "PREV_WEB_REVISION=$prev_web" >> "$GITHUB_ENV"

      - name: Create pre-migration Cloud SQL on-demand backup
        if: steps.gate.outputs.ready == 'true'
        run: |
          sql_instance_name="${SQL_INSTANCE##*:}"
          gcloud sql backups create \
            --instance="$sql_instance_name" \
            --description="Pre-deploy backup for $(git rev-parse --short=12 HEAD)" \
            --quiet

      - name: Run database migrations
        if: steps.gate.outputs.ready == 'true'
        run: |
          gcloud run jobs deploy steuereule-migrate \
            --image "$API_IMAGE" --region "$REGION" \
            --service-account "$API_SA" \
            --set-cloudsql-instances "$SQL_INSTANCE" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest" \
            --command sh --args="-c,cd /repo && pnpm --filter @steuereule/api migrate:deploy" \
            --max-retries 0 --task-timeout 600s \
            --execute-now --wait

      - name: Deploy API
        if: steps.gate.outputs.ready == 'true'
        run: |
          gcloud run deploy steuereule-api \
            --image "$API_IMAGE" --region "$REGION" \
            --service-account "$API_SA" \
            --add-cloudsql-instances "$SQL_INSTANCE" \
            --set-secrets "$API_SECRETS" \
            --set-env-vars "^@^NODE_ENV=production@BETTER_AUTH_URL=$API_ORIGIN@CORS_ALLOWED_ORIGINS=$WEB_ORIGIN@WEB_APP_URL=$WEB_ORIGIN@TRUSTED_PROXIES=$TRUSTED_PROXIES@EMAIL_FROM=$EMAIL_FROM" \
            --cpu 1 --memory 2Gi --cpu-boost \
            --min-instances 0 --max-instances 2 --concurrency 20 --timeout 120 \
            --allow-unauthenticated

      - name: Build and push web image
        if: steps.gate.outputs.ready == 'true'
        run: |
          docker build -f apps/mobile-web/Dockerfile --build-arg "EXPO_PUBLIC_API_BASE_URL=$API_ORIGIN" -t "$WEB_IMAGE" .
          docker push "$WEB_IMAGE"

      - name: Generate CycloneDX Release SBOMs (CRA / BSI TR-03183)
        if: steps.gate.outputs.ready == 'true'
        uses: aquasecurity/trivy-action@v0.30.0
        with:
          image-ref: ${{ env.API_IMAGE }}
          format: cyclonedx
          output: sbom-release-api.cdx.json

      - name: Upload CycloneDX Release SBOM artifact
        if: steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-cyclonedx-sbom
          path: sbom-release-api.cdx.json
          retention-days: 90

      - name: Deploy web
        if: steps.gate.outputs.ready == 'true'
        run: |
          gcloud run deploy steuereule-web \
            --image "$WEB_IMAGE" --region "$REGION" \
            --service-account "$WEB_SA" \
            --cpu 1 --memory 512Mi \
            --min-instances 0 --max-instances 2 \
            --allow-unauthenticated

      - name: Post-deploy smoke test (Health + Auth Capabilities + CORS + Web)
        if: steps.gate.outputs.ready == 'true'
        run: |
          api_url="$(gcloud run services describe steuereule-api --region "$REGION" --format='value(status.url)')"
          web_url="$(gcloud run services describe steuereule-web --region "$REGION" --format='value(status.url)')"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$api_url/v1/health/ready"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$api_url/v1/auth/capabilities"
          cors_headers="$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -D - -o /dev/null -H "Origin: $WEB_ORIGIN" "$api_url/v1/auth/capabilities" | tr -d '\r')"
          echo "$cors_headers" | grep -qi "^access-control-allow-origin: $WEB_ORIGIN$" || {
            echo "::error::Post-deploy CORS verification failed for Origin $WEB_ORIGIN"
            exit 1
          }
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "$web_url/"
          echo "::notice::Deployed $API_IMAGE → $API_ORIGIN, $WEB_IMAGE → $WEB_ORIGIN"

      - name: Automatic Cloud Run Traffic Rollback (on deploy or smoke failure)
        if: failure() && steps.gate.outputs.ready == 'true'
        run: |
          echo "::warning::Deployment or post-deploy smoke test failed! Rolling back Cloud Run traffic to previous revisions..."
          if [ -n "${PREV_API_REVISION:-}" ]; then
            gcloud run services update-traffic steuereule-api --region "$REGION" --to-revisions="$PREV_API_REVISION=100" --quiet || true
          fi
          if [ -n "${PREV_WEB_REVISION:-}" ]; then
            gcloud run services update-traffic steuereule-web --region "$REGION" --to-revisions="$PREV_WEB_REVISION=100" --quiet || true
          fi
