# Deployment to Google Cloud Run (ADR-0053), two environments (ADR-0109, ADR-0113):
#   staging     every green "Build & E2E" run on main, automatically, once the repository variable
#               DEPLOY_STAGING_AUTO is "true" (scripts/infra/gcp-setup.sh sets it after the first deploy), or by hand
#               (Actions -> Deploy -> Run workflow, from main). Until the variable is set the automatic run skips its
#               jobs: the run shows "skipped", not "success", and no deployment record is created (OPS-3).
#               Staging builds the API image and tags it api:staging-ok-<commit> once its smoke test has passed.
#   production  only by publishing a GitHub Release (tag vX.Y.Z): .github/workflows/release.yml checks the tag, then
#               calls this workflow with environment "production". It builds no API image: it promotes the one
#               staging ran for that commit, same digest (scripts/deploy/provide-api-image.sh). The job is bound to the
#               GitHub environment "production", so its required reviewers must approve it, and the GCP side only
#               accepts tokens of a v* tag. The web and website images are built per environment, because the
#               operator details and the origins are baked into them.
# There is no pull_request trigger: the check "static: opentofu validate" lives in quality.yml, so a pull request
# shows no skipped deploy jobs.
# Every deploy variable lives in its GitHub environment, none at repository level: a repository-level value
# would silently fill in for an environment that lacks it (OPS-13). The list of what the runtime needs is
# apps/api/src/config/production-config.ts; test/config/deployment-wiring.test.ts keeps this file in step with it.
name: Deploy

on:
  workflow_run:
    # The name of .github/workflows/ci.yml. deployment-wiring.test.ts checks that every name here exists (OPS-2).
    workflows: ['Build & E2E']
    types: [completed]
    branches: [main]
  # By hand, staging only (from main). A production deploy is a re-run of the Release workflow from its tag.
  workflow_dispatch:
  workflow_call:
    inputs:
      environment:
        description: The GitHub environment to deploy to. release.yml passes "production".
        type: string
        required: true

permissions:
  contents: read

# Deploys of one environment run one at a time: the group is on the deploy job, so it holds when this workflow is
# called (a workflow-level group of a called workflow would collide with the group of its caller).

jobs:
  # Runs without a GitHub environment, so `vars` holds the repository-level variables only. Any deploy
  # variable found here would fill in for an environment that lacks it; the deploy job refuses that (OPS-13).
  variable-scope:
    name: Deploy variables are environment-scoped
    if: >-
      inputs.environment != '' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       vars.DEPLOY_STAGING_AUTO == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repository_level: ${{ steps.scan.outputs.names }}
    steps:
      - name: Find deploy variables set at repository level
        id: scan
        env:
          REPOSITORY_VARS: ${{ toJSON(vars) }}
          DEPLOY_VARIABLES: >-
            GCP_ENVIRONMENT GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_DEPLOYER_SA GCP_RUNTIME_SA GCP_MIGRATE_SA GCP_WEB_SA
            GCP_SQL_INSTANCE GCP_KEYSTORE_SQL_INSTANCE GCP_VPC_NETWORK GCP_VPC_SUBNET GCP_PROMOTE_FROM_REGISTRY
            APP_DOMAIN EMAIL_FROM TRUSTED_PROXIES EXPO_PUBLIC_BETREIBER_NAME EXPO_PUBLIC_BETREIBER_ANSCHRIFT
            EXPO_PUBLIC_BETREIBER_EMAIL EXPO_PUBLIC_BETREIBER_VERTRETEN EXPO_PUBLIC_BETREIBER_USTID
        run: |
          names=""
          for name in $DEPLOY_VARIABLES; do
            if jq -e --arg name "$name" 'has($name)' <<<"$REPOSITORY_VARS" >/dev/null; then
              names="$names $name"
            fi
          done
          echo "names=${names# }" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy (Cloud Run)
    needs: variable-scope
    # The same condition as variable-scope: an automatic run before DEPLOY_STAGING_AUTO skips both jobs.
    if: >-
      inputs.environment != '' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       vars.DEPLOY_STAGING_AUTO == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Environment-level variables apply from here on (job env and steps), never at workflow level.
    environment: ${{ inputs.environment || 'staging' }}
    concurrency:
      group: deploy-${{ inputs.environment || 'staging' }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_ENV: ${{ inputs.environment || 'staging' }}
      REGION: ${{ vars.GCP_REGION }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      # Cloud Run direct ingress (*.run.app and domain mappings): the container's peer is Google's front end in
      # 169.254.0.0/16, which appends the client address to X-Forwarded-For. Behind an external load balancer the
      # LB ranges must be added, or every user shares one rate-limit bucket (OPS-8, infra/README.md).
      TRUSTED_PROXIES: ${{ vars.TRUSTED_PROXIES }}
      SQL_INSTANCE: ${{ vars.GCP_SQL_INSTANCE }}
      KEYSTORE_SQL_INSTANCE: ${{ vars.GCP_KEYSTORE_SQL_INSTANCE }}
      # Cloud SQL has a private address only (and Redis too): the service and the migrate job join this
      # network with Direct VPC egress. Only private ranges go through it.
      VPC_NETWORK: ${{ vars.GCP_VPC_NETWORK }}
      VPC_SUBNET: ${{ vars.GCP_VPC_SUBNET }}
      # Production only: the staging registry the API image is promoted from (scripts/deploy/provide-api-image.sh).
      PROMOTE_FROM_REGISTRY: ${{ vars.GCP_PROMOTE_FROM_REGISTRY }}
      API_SA: ${{ vars.GCP_RUNTIME_SA }}
      # The migrate job runs as its own service account: only it may read MIGRATE_DATABASE_URL, the login that
      # owns the tables (P11). The API's account cannot read that secret.
      MIGRATE_SA: ${{ vars.GCP_MIGRATE_SA }}
      WEB_SA: ${{ vars.GCP_WEB_SA }}
      # Operator details for the Impressum, baked into the web bundle at build time (WEB-2).
      EXPO_PUBLIC_BETREIBER_NAME: ${{ vars.EXPO_PUBLIC_BETREIBER_NAME }}
      EXPO_PUBLIC_BETREIBER_ANSCHRIFT: ${{ vars.EXPO_PUBLIC_BETREIBER_ANSCHRIFT }}
      EXPO_PUBLIC_BETREIBER_EMAIL: ${{ vars.EXPO_PUBLIC_BETREIBER_EMAIL }}
      EXPO_PUBLIC_BETREIBER_VERTRETEN: ${{ vars.EXPO_PUBLIC_BETREIBER_VERTRETEN }}
      EXPO_PUBLIC_BETREIBER_USTID: ${{ vars.EXPO_PUBLIC_BETREIBER_USTID }}
      # Secrets the API refuses to start without on a deployment, and those that switch a feature on.
      REQUIRED_SECRETS: >-
        DATABASE_URL GUEST_SESSION_SECRET PRISMA_FIELD_ENCRYPTION_KEY PRISMA_FIELD_ENCRYPTION_HASH_SALT
        KEYSTORE_DATABASE_URL KEYSTORE_MASTER_KEY BETTER_AUTH_SECRET BREVO_API_KEY
        STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PRICE_ID STRIPE_PRICE_ID_SELBSTSTAENDIG REDIS_URL
      OPTIONAL_SECRETS: >-
        PRISMA_FIELD_DECRYPTION_KEYS KEYSTORE_MASTER_KEY_PREVIOUS GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET
        APPLE_CLIENT_ID APPLE_CLIENT_SECRET GEMINI_API_KEY GOOGLE_API_KEY ANTHROPIC_API_KEY OPENAI_API_KEY MISTRAL_API_KEY
        AI_API_KEY AI_ADVISOR_API_KEY AI_VISION_API_KEY AI_FALLBACK_API_KEY AI_GUARD_API_KEY ELSTER_CERT_PIN
        REDIS_TLS_CA
      # Never mounted into the API service: the login that owns the tables, for the migrate job alone.
      MIGRATE_ONLY_SECRETS: >-
        MIGRATE_DATABASE_URL
    steps:
      - name: Configuration gate
        env:
          REPOSITORY_LEVEL: ${{ needs.variable-scope.outputs.repository_level }}
          ENVIRONMENT_VARS: ${{ toJSON(vars) }}
          REQUIRED_VARIABLES: >-
            GCP_ENVIRONMENT GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_DEPLOYER_SA GCP_RUNTIME_SA GCP_MIGRATE_SA GCP_WEB_SA
            GCP_SQL_INSTANCE GCP_KEYSTORE_SQL_INSTANCE GCP_VPC_NETWORK GCP_VPC_SUBNET APP_DOMAIN EMAIL_FROM
            TRUSTED_PROXIES EXPO_PUBLIC_BETREIBER_NAME EXPO_PUBLIC_BETREIBER_ANSCHRIFT EXPO_PUBLIC_BETREIBER_EMAIL
        run: |
          if [ -n "$REPOSITORY_LEVEL" ]; then
            echo "::error::Deploy variables set at repository level: $REPOSITORY_LEVEL — move them into the GitHub environment '$TARGET_ENV' (Settings -> Environments). At repository level they silently fill in for any environment that lacks them."
            exit 1
          fi
          # Staging deploys the tip of main, production a release tag; the GCP side refuses other refs too.
          if [ "$TARGET_ENV" = "production" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) ;;
              *)
                echo "::error::Production deploys run only from a release tag v* (this run is on $GITHUB_REF): publish a release, or re-run the Release workflow from its tag."
                exit 1
                ;;
            esac
          elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Staging deploys run only from main (this run is on $GITHUB_REF); the GCP side refuses other refs too."
            exit 1
          fi
          missing=""
          for name in $REQUIRED_VARIABLES; do
            jq -e --arg name "$name" '(.[$name] // "") != ""' <<<"$ENVIRONMENT_VARS" >/dev/null || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Variables missing in the GitHub environment '$TARGET_ENV':$missing — run scripts/infra/gcp-setup.sh (infra/README.md)."
            exit 1
          fi
          if [ "$TARGET_ENV" = "production" ] && ! jq -e '(.GCP_PROMOTE_FROM_REGISTRY // "") != ""' <<<"$ENVIRONMENT_VARS" >/dev/null; then
            echo "::error::GCP_PROMOTE_FROM_REGISTRY is missing in the GitHub environment 'production': it names the staging registry the API image is promoted from (infra/README.md)."
            exit 1
          fi
          marker="$(jq -r '.GCP_ENVIRONMENT' <<<"$ENVIRONMENT_VARS")"
          if [ "$marker" != "$TARGET_ENV" ]; then
            echo "::error::GCP_ENVIRONMENT is '$marker' in the GitHub environment '$TARGET_ENV' — refusing to deploy values meant for another environment."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Resolve images and origins
        run: scripts/deploy/resolve-images-and-origins.sh

      # Staging builds the API image, production promotes the one staging ran (same digest). Either way API_IMAGE
      # is pinned by digest from here on.
      - name: Provide the API image
        run: scripts/deploy/provide-api-image.sh

      - name: Collect secrets that have a value
        run: scripts/deploy/collect-secrets.sh

      - name: Capture current Cloud Run revisions for rollback safety
        id: revisions
        run: |
          prev_api="$(gcloud run services describe steuereule-api --region "$REGION" --format='value(status.latestReadyRevisionName)' 2>/dev/null || true)"
          prev_web="$(gcloud run services describe steuereule-web --region "$REGION" --format='value(status.latestReadyRevisionName)' 2>/dev/null || true)"
          echo "PREV_API_REVISION=$prev_api" >> "$GITHUB_ENV"
          echo "PREV_WEB_REVISION=$prev_web" >> "$GITHUB_ENV"

      # Needs the deployer's custom role "Steuereule pre-deploy backup" (infra/gcp/main.tf, OPS-11).
      - name: Create pre-migration Cloud SQL on-demand backup
        run: |
          sql_instance_name="${SQL_INSTANCE##*:}"
          gcloud sql backups create \
            --instance="$sql_instance_name" \
            --description="Pre-deploy backup for $APP_VERSION" \
            --quiet

      - name: Run database migrations
        run: scripts/deploy/run-migrations.sh

      - name: Deploy API
        run: scripts/deploy/deploy-api.sh

      - name: Build and push web image
        run: scripts/deploy/build-web-image.sh

      - name: Build and push website image
        run: |
          docker build -f apps/website/Dockerfile \
            --build-arg "WEBSITE_APP_ORIGIN=$WEB_ORIGIN" \
            --build-arg "API_ORIGIN=$API_ORIGIN" \
            -t "$WEBSITE_IMAGE" .
          docker push "$WEBSITE_IMAGE"

      - name: Generate CycloneDX Release SBOMs (CRA / BSI TR-03183)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.API_IMAGE }}
          format: cyclonedx
          output: sbom-release-api.cdx.json

      - name: Upload CycloneDX Release SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-cyclonedx-sbom
          path: sbom-release-api.cdx.json
          retention-days: 90

      - name: Deploy web
        run: |
          gcloud run deploy steuereule-web \
            --image "$WEB_IMAGE" --region "$REGION" \
            --service-account "$WEB_SA" \
            --cpu 1 --memory 512Mi \
            --min-instances 0 --max-instances 10 --concurrency 160 \
            --allow-unauthenticated

      - name: Deploy website
        run: |
          gcloud run deploy steuereule-website \
            --image "$WEBSITE_IMAGE" --region "$REGION" \
            --service-account "$WEB_SA" \
            --cpu 1 --memory 256Mi \
            --min-instances 0 --max-instances 3 --concurrency 160 \
            --allow-unauthenticated

      - name: Post-deploy smoke test (Health + Auth Capabilities + CORS + Web)
        run: scripts/deploy/post-deploy-smoke.sh

      # The only image production promotes: one that passed this smoke test on staging.
      - name: Mark the API image as proven on staging
        if: env.TARGET_ENV == 'staging'
        run: scripts/deploy/mark-staging-proven.sh

      - name: Automatic Cloud Run Traffic Rollback (on deploy or smoke failure)
        if: failure() && steps.revisions.outcome == 'success'
        run: |
          echo "::warning::Deployment or post-deploy smoke test failed! Rolling back Cloud Run traffic to previous revisions..."
          if [ -n "${PREV_API_REVISION:-}" ]; then
            gcloud run services update-traffic steuereule-api --region "$REGION" --to-revisions="$PREV_API_REVISION=100" --quiet || true
          fi
          if [ -n "${PREV_WEB_REVISION:-}" ]; then
            gcloud run services update-traffic steuereule-web --region "$REGION" --to-revisions="$PREV_WEB_REVISION=100" --quiet || true
          fi
