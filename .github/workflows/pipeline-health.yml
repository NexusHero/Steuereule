# How long the pipeline takes and how often it is wrong, from the runs GitHub recorded over the last 28 days:
# wall time of green pull-request runs per workflow, time to green per commit, failed pushes to main, and jobs
# that failed and then passed on a rerun. The report is the job summary of this run. It only reads and reports;
# scripts/ci/pipeline-health.mjs states what the flake count cannot see.
name: Pipeline health (weekly)

on:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: How many days back to measure (1 to 90).
        type: number
        default: 28

permissions:
  contents: read
  actions: read

concurrency:
  group: pipeline-health
  cancel-in-progress: true

jobs:
  report:
    name: 'report: pipeline duration and flaky jobs'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No install in this job: the script is plain Node (see quality.yml docs-consistency for the same opt-out).
          package-manager-cache: false
      - name: Measure and write the job summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days || 28 }}
        run: node scripts/ci/pipeline-health.mjs --days "$DAYS" >> "$GITHUB_STEP_SUMMARY"
