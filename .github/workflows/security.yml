# Security pipeline: secret scan, SAST, dependency audit, IaC/Dockerfile scan and workflow lint. Container and SBOM scans stay
# with the image build in ci.yml. Each tool is its own job/check (ADR-0105) so a failure names the tool
# instead of hiding inside one bundled "DevSecOps Static" check. Blocking on HIGH/CRITICAL findings.
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One in-flight run per ref; a newer push cancels the older run.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: 'security: secret scan (gitleaks)'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks Secret Scanning (.gitleaks.toml)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dependency-audit:
    name: 'security: dependency audit (production deps)'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Nothing is installed here, so there is no store to cache; the post step failed on the missing path.
          package-manager-cache: false
      # `pnpm audit` reads pnpm-lock.yaml, so no install is needed. Fails on high/critical advisories
      # in production dependencies; the few accepted paths carry a reason and an expiry date in the script.
      - name: Audit production dependencies (high and critical block)
        run: |
          node --test scripts/checks/dependency-audit.test.mjs
          node scripts/checks/dependency-audit.mjs

  dockerfiles:
    name: 'security: dockerfile lint (hadolint)'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hadolint — Lint apps/api/Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: apps/api/Dockerfile
          failure-threshold: error
      - name: Hadolint — Lint apps/mobile-web/Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: apps/mobile-web/Dockerfile
          failure-threshold: error

  actions-lint:
    name: 'security: workflow lint (actionlint)'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Actionlint — Lint .github/workflows/*.yml
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  iac:
    name: 'security: iac scan (trivy — terraform, dockerfiles, compose, k8s)'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy IaC Scan (Terraform, Dockerfiles, Compose & K8s — HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore

  sast:
    name: 'security: sast (semgrep — custom NestJS/DSGVO rules)'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep SAST Scan (.semgrep.yml custom NestJS/DSGVO rules)
        run: docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.110.0 semgrep scan --config .semgrep.yml --error
