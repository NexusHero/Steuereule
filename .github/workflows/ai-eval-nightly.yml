# #450 Teil 1B — nightly evaluation of the Eule against the real model (Gemini Flash, D6).
# Needs the repository secret AI_EVAL_GEMINI_API_KEY; without it the job reports "skipped" and passes.
# D9: the first week only produces the report (artifact + job summary). To turn on the gate, set the
# repository variable AI_EVAL_ENFORCE to 1.
name: AI eval (nightly)

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-eval-nightly
  cancel-in-progress: false

jobs:
  ai-eval:
    name: Eule against the real model — amounts vs core, StBerG, sources, injection, PII, consistency, TTFT
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The chat scenarios (ADR-0066) apply drafts and read the stored values back, so they need a database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: steuereule
          POSTGRES_PASSWORD: steuereule
          POSTGRES_DB: steuereule
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U steuereule -d steuereule"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://steuereule:steuereule@localhost:5432/steuereule
      TRUSTED_PROXIES: none
      AI_EVAL_GEMINI_API_KEY: ${{ secrets.AI_EVAL_GEMINI_API_KEY }}
      AI_EVAL_ENFORCE: ${{ vars.AI_EVAL_ENFORCE || '0' }}
      AI_EVAL_COST_CAP_EUR: '5'
      AI_EVAL_REPORT_DIR: /tmp/ai-eval
    steps:
      - name: Skip without the secret
        id: key
        run: |
          if [ -z "${AI_EVAL_GEMINI_API_KEY}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "## KI-Evaluation übersprungen" >> "$GITHUB_STEP_SUMMARY"
            echo "Das Secret \`AI_EVAL_GEMINI_API_KEY\` ist nicht gesetzt." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.key.outputs.present == 'true'
      - name: Set up pnpm
        if: steps.key.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - name: Set up Node
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Run the evaluation
        if: steps.key.outputs.present == 'true'
        run: pnpm --filter @steuereule/api exec node --import tsx scripts/ai-eval/run.ts
      # #476: reasoning summaries, token usage and prompt-cache hits, which unit tests can only imitate.
      - name: Check reasoning, usage and caching against the real model
        if: steps.key.outputs.present == 'true'
        run: pnpm --filter @steuereule/api exec node --import tsx scripts/ai-eval/reasoning-check.ts
      # ADR-0069 §Themengrenze: does the topic boundary hold? Refusal rate of ~40 attempts, false
      # refusals of ~40 tax questions, and the owl's own rule with the guard down. Also run it by
      # hand before every model change. Red fails the job only once AI_EVAL_ENFORCE is 1.
      - name: The topic boundary holds
        if: always() && steps.key.outputs.present == 'true'
        continue-on-error: ${{ env.AI_EVAL_ENFORCE != '1' }}
        run: pnpm --filter @steuereule/api test:eval -- test/eval/topic-guard.eval.test.ts
      # ADR-0066: one customer sentence per area of the return, against the real model and a real
      # database — is the right field filled with the right value? A report like the evaluation
      # above: red scenarios fail the job only once AI_EVAL_ENFORCE is 1.
      - name: Prepare the database for the chat scenarios
        if: always() && steps.key.outputs.present == 'true'
        run: |
          pnpm --filter @steuereule/api prisma:generate
          pnpm --filter @steuereule/api migrate:deploy
      - name: The owl fills the return through the chat
        if: always() && steps.key.outputs.present == 'true'
        continue-on-error: ${{ env.AI_EVAL_ENFORCE != '1' }}
        run: pnpm --filter @steuereule/api test:live
      - name: Upload the report
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-report
          path: /tmp/ai-eval
          if-no-files-found: ignore
