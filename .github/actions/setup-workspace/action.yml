name: Set up the workspace
description: pnpm, Node 24 with the pnpm cache, and a frozen-lockfile install. Every job that builds or runs the app starts here (after checkout).
runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
