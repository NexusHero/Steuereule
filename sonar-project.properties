# SonarQube Cloud, analysed from CI (the `sonar` job in .github/workflows/ci.yml) so the
# coverage reports of the test job can be imported. Automatic analysis must stay off.
sonar.organization=nexushero
sonar.projectKey=NexusHero_Steuereule

sonar.sources=.
# Reference material, documentation and generated code are not ours to maintain.
# Test files are tests, not sources: sources and tests both start at the root, so the test
# patterns must be excluded here too, or Sonar counts them as uncovered production code.
sonar.exclusions=finanzo-funke-design-system/**,docs/**,packages/api-client/src/generated/**,**/*.test.ts,**/*.test.tsx,apps/api/test/**,apps/mobile-web/src/test-*,e2e/**
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,apps/api/test/**,apps/mobile-web/src/test-*,e2e/**
# A table of legal sources: its rows only look alike to the copy-paste detector.
sonar.cpd.exclusions=apps/api/src/ki/ki.adapter.ts

# Written by `vitest run --coverage` in each package, paths relative to the repo root.
sonar.javascript.lcov.reportPaths=packages/core/coverage/lcov.info,packages/tokens/coverage/lcov.info,packages/ui/coverage/lcov.info,packages/api-client/coverage/lcov.info,apps/api/coverage/lcov.info,apps/mobile-web/coverage/lcov.info
