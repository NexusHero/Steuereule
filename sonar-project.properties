# SonarQube Cloud, analysed from CI (the `sonar` job in .github/workflows/quality.yml) so the
# coverage reports of the test job can be imported. Automatic analysis must stay off.
sonar.organization=nexushero
sonar.projectKey=NexusHero_Steuereule

sonar.sources=.
# Reference material, documentation and generated code are not ours to maintain.
# Test files are tests, not sources: sources and tests both start at the root, so the test
# patterns must be excluded here too, or Sonar counts them as uncovered production code.
sonar.exclusions=finanzo-funke-design-system/**,docs/**,packages/api-client/src/generated/**,**/*.test.ts,**/*.test.tsx,apps/api/test/**,apps/mobile-web/src/test-*,e2e/**
sonar.tests=.
# Repository tooling (CI checks, load test, generators) is not product code: the checks are proven by
# breaking them (ADR-0021), the load test runs in the Load pipeline. The coverage gate is for the apps
# and packages, so tooling is left out of the coverage measure (it is still analysed for issues).
sonar.coverage.exclusions=scripts/**,apps/api/scripts/**
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,apps/api/test/**,apps/mobile-web/src/test-*,e2e/**
# A table of legal sources: its rows only look alike to the copy-paste detector.
sonar.cpd.exclusions=apps/api/src/ki/ki.adapter.ts

# Written by `vitest run --coverage` in each package (apps/api twice: unit and integration tier), paths relative to the repo root.
sonar.javascript.lcov.reportPaths=packages/core/coverage/lcov.info,packages/tokens/coverage/lcov.info,packages/ui/coverage/lcov.info,packages/api-client/coverage/lcov.info,apps/api/coverage/lcov.info,apps/api/coverage-integration/lcov.info,apps/mobile-web/coverage/lcov.info

# The PL/SQL analyzer reads the assignment `SET "col" = NULL` in a PostgreSQL migration as a comparison
# (plsql:NullComparison). Migrations are PostgreSQL, not PL/SQL; the rule stays on for every other SQL file.
sonar.issue.ignore.multicriteria=pgnull
sonar.issue.ignore.multicriteria.pgnull.ruleKey=plsql:NullComparison
sonar.issue.ignore.multicriteria.pgnull.resourceKey=apps/api/prisma/migrations/**/*.sql
