# ---------------------------------------------------------------------------
# The web app (Expo static export) — apps/mobile-web/Dockerfile serves the bundle via
# e2e/cross-origin/static-server.mjs on :8080. Stateless, so a Deployment.
#
# CRITICAL (ADR-0026): EXPO_PUBLIC_API_BASE_URL is baked INTO the JS bundle at BUILD
# time, never read at runtime. So the web image is PER-ENVIRONMENT: staging's image
# points the browser at the staging API, prod's at the prod API. The image tag encodes
# this (deploy.yml builds web with the right build-arg, 06.4). You cannot fix a wrong
# origin with an env var here — it requires a rebuild, exactly like the compose stack.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/steuereule/web:CHANGE_ME # per-env image (see header comment)
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
