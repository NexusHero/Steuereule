# ---------------------------------------------------------------------------
# DO NOT APPLY THIS FILE. It documents the SHAPE of the Secret that sub-ticket 06.3
# creates via Sealed Secrets — the real values never enter this repo unencrypted (or at
# all). The file is deliberately NOT listed in kustomization.yaml, so `kubectl apply -k`
# can never accidentally create a Secret full of empty strings.
#
# How the real thing lands (06.3):
#   1. Write the real values into a LOCAL Secret manifest (never committed).
#   2. Seal it against the cluster controller:
#        kubeseal --controller-name sealed-secrets --controller-namespace kube-system \
#          -o yaml < secret.yaml > sealed-secret.yaml
#   3. Commit ONLY sealed-secret.yaml (the encrypted blob — safe to version).
#   4. The in-cluster controller decrypts it into this Secret.
#
# The eight values below are the app's secret surface, one-to-one with .env.example's
# secret list (the two PORT/origin values are config, not secret — they live in the
# ConfigMap). REQ-003's PRISMA_FIELD_ENCRYPTION_KEY is the rotation-sensitive one: see
# sub-ticket 06.3 — rotating it is a data migration, not a plain re-issue.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: steuereule-api-secrets
type: Opaque
stringData:
  DATABASE_URL: ""                # postgresql://<user>:<pass>@<managed-eu-postgres-host>:5432/steuereule
  REDIS_URL: ""                   # redis://:<pass>@redis:6379
  REDIS_PASSWORD: ""              # matches --requirepass on the redis container
  GUEST_SESSION_SECRET: ""        # ADR-0008: refuses a guessable default under prod
  PRISMA_FIELD_ENCRYPTION_KEY: "" # REQ-003 — rotation = data migration (06.3), not just a new value
  BETTER_AUTH_SECRET: ""          # ADR-0012
  GOOGLE_CLIENT_ID: ""            # real value needs #170; the dev placeholder does NOT work in prod
  GOOGLE_CLIENT_SECRET: ""        # same
