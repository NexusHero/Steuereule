# The API is reachable ONLY inside the cluster (ClusterIP) and exposed through the
# ingress/proxy — no public NodePort. That "app only via a real proxy" property is
# exactly what REQ-010 rate-limiting and TRUSTED_PROXIES need (sub-ticket 06.8).
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
