<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SteuerEule — Anmelde-Zustände (Referenz)</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body{background:var(--papier);padding:24px;font-family:var(--schrift-text),system-ui,sans-serif}
  .galerie{display:grid;grid-template-columns:repeat(auto-fill,minmax(560px,1fr));gap:22px;max-width:1232px;margin:0 auto}
  .panel>.mono-label{display:block;margin-bottom:8px}
  .schmal{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:22px;max-width:1232px;margin:26px auto 0}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="AuthGeraete.jsx"></script>
<script type="text/babel">
const QR_ZUSTAENDE = [
  ['Lädt — der Code wird geholt', { start: 'laedt' }],
  ['Code steht — QR + Zeichen-Code + Lebensdauer', { start: 'bereit', startSek: 97 }],
  ['Läuft ab — Vorwarnung unter 20 Sekunden', { start: 'bereit', startSek: 14 }],
  ['Abgelaufen — ein Klick zum neuen Code', { start: 'abgelaufen', startSek: 0 }],
  ['Fehlgeschlagen — ehrlich: liegt an uns, mit Ausweg', { start: 'fehler' }],
  ['Wartet — am anderen Gerät bestätigen', { start: 'wartet' }],
  ['Bestätigt — Anmeldung läuft durch', { start: 'bestaetigt' }],
  ['Abgelehnt — nichts passiert, Passwort-Hinweis', { start: 'abgelehnt' }],
];
function Galerie() {
  return (
    <div>
      <div className="galerie">
        {QR_ZUSTAENDE.map(([label, props]) => (
          <div className="panel" key={label}>
            <span className="mono-label">{label}</span>
            <window.FunkeQrKopplung statisch {...props}></window.FunkeQrKopplung>
          </div>
        ))}
      </div>
      <div className="schmal">
        <div className="panel">
          <span className="mono-label">Telefon: entscheiden — „Warst du das?"</span>
          <window.FunkeGeraetBestaetigen start="entscheiden"></window.FunkeGeraetBestaetigen>
        </div>
        <div className="panel">
          <span className="mono-label">Telefon: zugestimmt</span>
          <window.FunkeGeraetBestaetigen start="zugestimmt"></window.FunkeGeraetBestaetigen>
        </div>
        <div className="panel">
          <span className="mono-label">Telefon: abgelehnt</span>
          <window.FunkeGeraetBestaetigen start="abgelehnt"></window.FunkeGeraetBestaetigen>
        </div>
        <div className="panel">
          <span className="mono-label">Google nicht eingerichtet — ehrlich statt spurlos weg</span>
          <div className="fk-karte" style={{ padding: 16 }}>
            <div style={{ minHeight: 52, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10, border: '1.5px dashed var(--linie-weich)', borderRadius: 14, padding: '8px 16px', color: 'var(--tinte-2)', fontSize: 13 }}>
              <span>Google ist auf diesem Gerät nicht eingerichtet — die anderen Wege stehen dir offen.</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Galerie />);
</script>
</body>
</html>
