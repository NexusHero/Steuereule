<!-- @dsCard group="App" viewport="420x680" name="Passwort-Reset" subtitle="Anfordern → neutrale Bestätigung (kein Ausspäh-Kanal) → neues Passwort → überall abgemeldet, zurück zur Anmeldung" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SteuerEule — Passwort-Reset</title>
<link rel="stylesheet" href="../../styles.css">
<script>try { if (localStorage.getItem('funke.theme') === 'dunkel') document.documentElement.dataset.theme = 'dunkel'; } catch (e) {}</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  .app-shell { max-width: 420px; margin: 0 auto; padding: 12px 20px 60px; }
  /* responsiv */
  @media (min-width: 700px) { .app-shell { max-width: 560px; padding-top: 36px; } }
  @media (min-width: 1100px) { .app-shell { max-width: 640px; } }
  .fx-mark { font-style: normal; display: inline-block; transform: rotate(-1.5deg); background: var(--funke); border: var(--kontur) solid var(--tinte); border-radius: 10px; padding: 0 10px; }
  @media (prefers-reduced-motion: no-preference) { .fx-schritt { animation: funke-auftritt var(--t-auftritt) var(--feder) both; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="PasswortReset.jsx"></script>
<script type="text/babel">
/* Der zweite Schritt beginnt im echten Produkt am Link aus der Mail — hier über den
   Hash erreichbar, damit die Referenz komplett durchklickbar bleibt:
   #neu → neues Passwort setzen · #abgelaufen · #verbraucht */
const START = { '#neu': 'neues-passwort', '#abgelaufen': 'abgelaufen', '#verbraucht': 'verbraucht' }[window.location.hash] || 'anfordern';
ReactDOM.createRoot(document.getElementById('root')).render(
  <div className="app-shell">
    <FunkePasswortReset start={START} onZurAnmeldung={() => { window.location.href = 'auth.html'; }} />
  </div>
);
</script>
</body>
</html>
