<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SteuerEule — Passwort-Reset-Zustände (Referenz)</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body{background:var(--papier);padding:24px;font-family:var(--schrift-text),system-ui,sans-serif}
  .galerie{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:22px;max-width:1232px;margin:0 auto}
  .panel>.mono-label{display:block;margin-bottom:8px}
  .panel .fk-karte{padding:0 18px 26px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="PasswortReset.jsx"></script>
<script type="text/babel">
/* Ein Zustand pro Panel. Die neutrale Bestätigung ist ABSICHTLICH der einzige
   Ausgang von Schritt 1: ob ein Konto existiert, verrät dieser Flow nirgends —
   deshalb hat diese Galerie keinen Zustand „Konto nicht gefunden", und das ist
   kein Loch in der Referenz, sondern die Referenz. */
const ZUSTAENDE = [
  ['Anfordern — leer', { start: 'anfordern' }],
  ['Anfordern — getippt', { start: 'anfordern', mailStart: 'du@beispiel.de' }],
  ['Anfordern — keine E-Mail-Form', { start: 'anfordern', mailStart: 'du.beispiel.de', fehlerStart: 'Das sieht noch nicht nach einer E-Mail aus.' }],
  ['Gesendet — dieselbe Antwort für JEDE Adresse', { start: 'gesendet', mailStart: 'du@beispiel.de' }],
  ['Neues Passwort — Einstieg über den Mail-Link', { start: 'neues-passwort' }],
  ['Neues Passwort — zu kurz', { start: 'neues-passwort', fehlerStart: 'Mindestens 6 Zeichen fürs Passwort.' }],
  ['Neues Passwort — stimmen nicht überein', { start: 'neues-passwort', fehlerStart: 'Die beiden Passwörter stimmen nicht überein.' }],
  ['Link gilt nicht mehr — abgelaufen ODER benutzt, EIN ehrlicher Zustand (im Produkt: nach dem Absenden)', { start: 'ungueltig' }],
  ['Erfolg — Passwort neu UND überall abgemeldet, weiter zur Anmeldung', { start: 'erfolg' }],
];
function Galerie() {
  return (
    <div className="galerie">
      {ZUSTAENDE.map(([label, props]) => (
        <div className="panel" key={label}>
          <span className="mono-label">{label}</span>
          <div className="fk-karte">
            <window.FunkePasswortReset {...props}></window.FunkePasswortReset>
          </div>
        </div>
      ))}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Galerie />);
</script>
</body>
</html>
