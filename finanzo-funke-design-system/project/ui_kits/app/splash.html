<!-- @dsCard group="App" viewport="420x760" name="Splash (App-Start)" subtitle="Beim Öffnen mit Session: Marke zeichnet sich, grüßt namentlich, geht selbst weiter" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SteuerEule — Splash</title>
<link rel="stylesheet" href="../../styles.css">
<script>try { if (localStorage.getItem('funke.theme') === 'dunkel') document.documentElement.dataset.theme = 'dunkel'; } catch (e) {}</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  .fx-splash {
    position: fixed; inset: 0; z-index: 50; width: 100%;
    background: var(--nacht); color: var(--nacht-text); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  }
  .fx-wort { font-family: var(--schrift-display); font-weight: 800; font-size: 44px; letter-spacing: -0.03em; }
  .fx-wort b { color: var(--funke); }
  .fx-gruss { font-size: 17px; opacity: 0.9; }
  .fx-gruss i {
    font-style: normal; display: inline-block; transform: rotate(-2deg);
    background: var(--funke); color: var(--tinte); font-weight: 800;
    border-radius: 8px; padding: 0 8px; border: var(--kontur) solid var(--tinte);
  }
  .fx-stand { position: absolute; bottom: 28px; font-family: var(--schrift-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.45; }
  @media (prefers-reduced-motion: no-preference) {
    .fx-marke .au-kopf { opacity: 0; transform: scale(0.55); transform-box: fill-box; transform-origin: center; animation: au-pop 0.45s var(--feder) 0.1s forwards; }
    .fx-marke .au-brille { opacity: 0; transform: translateY(-16px); animation: au-auf 0.4s var(--feder) 0.55s forwards; }
    .fx-marke .au-lid { transform: scaleY(0); transform-box: fill-box; transform-origin: center top; animation: au-blinzeln 0.4s ease-in-out 1.3s; }
    @keyframes au-pop { to { opacity: 1; transform: none; } }
    @keyframes au-auf { to { opacity: 1; transform: none; } }
    @keyframes au-blinzeln { 0%, 100% { transform: scaleY(0); } 45% { transform: scaleY(1); } }
    .fx-wort { opacity: 0; animation: funke-auftritt 0.45s var(--feder) 0.9s forwards; }
    .fx-gruss { opacity: 0; animation: funke-auftritt 0.45s var(--feder) 1.1s forwards; }
    .fx-gruss i { animation: funke-pop 0.38s var(--feder) 1.35s both; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function SplashStart() {
  const [name] = React.useState(() => {
    try { return (JSON.parse(localStorage.getItem('funke.onboarding.profil')) || {}).vorname || ''; }
    catch (e) { return ''; }
  });
  const weiter = () => { window.location.href = 'index.html'; };
  /* ADR-019: online-only — ohne Netz bleibt der Splash stehen und sagt es ehrlich */
  const [offline, setOffline] = React.useState(() => !navigator.onLine);
  React.useEffect(() => {
    const on = () => setOffline(false);
    const off = () => setOffline(true);
    window.addEventListener('online', on); window.addEventListener('offline', off);
    return () => { window.removeEventListener('online', on); window.removeEventListener('offline', off); };
  }, []);
  React.useEffect(() => {
    if (offline) return;
    const t = setTimeout(weiter, 2200);
    return () => clearTimeout(t);
  }, [offline]);
  return (
    <button className="fx-splash" onClick={weiter} aria-label="Weiter zur App">
      <svg className="fx-marke" viewBox="0 0 96 96" width="104" height="104" aria-hidden="true">
        <g className="au-kopf">
          <path d="M20 36 L30 10 L41 24 Z" fill="var(--funke)"></path>
          <path d="M76 36 L66 10 L55 24 Z" fill="var(--funke)"></path>
          <rect x="14" y="20" width="68" height="64" rx="30" fill="var(--funke)"></rect>
          <path d="M48 58 L55 65 L48 74 L41 65 Z" fill="var(--nacht)"></path>
        </g>
        <g className="au-brille">
          <rect x="42" y="44" width="12" height="6" rx="3" fill="var(--nacht)"></rect>
          <circle cx="33" cy="47" r="14" fill="var(--nacht)"></circle>
          <circle cx="63" cy="47" r="14" fill="var(--nacht)"></circle>
          <circle cx="36" cy="45" r="5.5" fill="var(--funke)"></circle>
          <circle cx="66" cy="45" r="5.5" fill="var(--funke)"></circle>
          <rect className="au-lid" x="19" y="33" width="28" height="28" rx="14" fill="var(--funke)"></rect>
          <rect className="au-lid" x="49" y="33" width="28" height="28" rx="14" fill="var(--funke)"></rect>
        </g>
      </svg>
      <span className="fx-wort">Steuer<b>Eule</b></span>
      <span className="fx-gruss">{name ? <span>Willkommen zurück, <i>{name}</i>.</span> : <span>Steuern? <i>Zack,</i> erledigt.</span>}</span>
      {offline ? (
        <span className="fx-stand" style={{ color: 'var(--warn)', fontWeight: 700 }}>Kein Internet — SteuerEule braucht Netz. Deine Daten liegen sicher auf EU-Servern; ein angefangenes Beleg-Foto geht nicht verloren.</span>
      ) : (
        <span className="fx-stand">Steuerjahr 2026 · Stand gespeichert</span>
      )}
    </button>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<SplashStart />);
</script>
</body>
</html>
