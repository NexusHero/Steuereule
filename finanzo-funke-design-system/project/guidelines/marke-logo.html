<!DOCTYPE html>
<html lang="de">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body { padding: 20px 24px; display: flex; gap: 20px; align-items: stretch; }
.tile { flex: 1; border: var(--kontur) solid var(--tinte); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
.wort { font-family: var(--schrift-display); font-weight: 800; font-size: 30px; letter-spacing: -0.03em; }
</style></head>
<body>
<div class="tile" style="background: var(--karte);">
  <img src="../assets/marke-tinte.svg" width="58" height="58" alt="SteuerEule Bildmarke">
  <span class="wort">Steuer<b style="color: var(--funke-tinte);">Eule</b></span>
</div>
<div class="tile" style="background: var(--nacht); color: var(--nacht-text);">
  <img src="../assets/marke-funke.svg" width="58" height="58" alt="SteuerEule Bildmarke auf Nacht">
  <span class="wort">Steuer<b style="color: var(--funke);">Eule</b></span>
</div>
</body>
</html>
