<!DOCTYPE html>
<html lang="de">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body { display: flex; gap: 12px; padding: 16px; }
.sw { flex: 1; border-radius: var(--radius-s); padding: 10px; height: 110px; display: flex; flex-direction: column; justify-content: flex-end; border: var(--kontur) solid; }
.sw b { font-family: var(--schrift-mono); font-size: 11px; font-weight: 400; display: block; }
</style></head>
<body>
<div class="sw" style="background: var(--ok-weich); border-color: var(--ok); color: var(--ok);"><b>--ok</b><b>#1F9D55</b></div>
<div class="sw" style="background: var(--warn-weich); border-color: var(--warn); color: var(--warn);"><b>--warn</b><b>#E07B00</b></div>
<div class="sw" style="background: var(--fehler-weich); border-color: var(--fehler); color: var(--fehler);"><b>--fehler</b><b>#E0362C</b></div>
</body>
</html>
