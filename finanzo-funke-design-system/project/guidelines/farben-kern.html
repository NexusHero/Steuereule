<!DOCTYPE html>
<html lang="de">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body { display: flex; gap: 12px; padding: 16px; }
.sw { flex: 1; border: var(--kontur) solid var(--tinte); border-radius: var(--radius-s); padding: 10px; height: 110px; display: flex; flex-direction: column; justify-content: flex-end; }
.sw b { font-family: var(--schrift-mono); font-size: 11px; font-weight: 400; display: block; }
</style></head>
<body>
<div class="sw" style="background: var(--grund);"><b>--grund</b><b>#F4F2E9</b></div>
<div class="sw" style="background: var(--karte);"><b>--karte</b><b>#FFFFFF</b></div>
<div class="sw" style="background: var(--tinte); color: var(--nacht-text);"><b>--tinte</b><b>#191B12</b></div>
<div class="sw" style="background: var(--funke);"><b>--funke</b><b>#C9F229</b></div>
</body>
</html>
