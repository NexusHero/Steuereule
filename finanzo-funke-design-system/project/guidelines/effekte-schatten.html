<!-- @dsCard group="Effects" viewport="700x180" name="Harte Schatten" subtitle="Sticker-Optik: 2/4/7px Versatz, kein Blur" -->
<!DOCTYPE html>
<html lang="de">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body { padding: 24px; display: flex; gap: 28px; align-items: center; }
.k { background: var(--karte); border: var(--kontur) solid var(--tinte); border-radius: var(--radius); width: 130px; height: 90px; display: flex; align-items: flex-end; padding: 8px; }
.k code { font-family: var(--schrift-mono); font-size: 11px; color: var(--tinte-2); }
</style></head>
<body>
<div class="k" style="box-shadow: var(--schatten-hart-s);"><code>hart-s 2px</code></div>
<div class="k" style="box-shadow: var(--schatten-hart);"><code>hart 4px</code></div>
<div class="k" style="box-shadow: var(--schatten-hart-l);"><code>hart-l 7px</code></div>
<div class="k" style="box-shadow: var(--schatten-ki); border-color: var(--ki); background: var(--ki-weich);"><code style="color: var(--ki-tinte);">ki (nur KI)</code></div>
</body>
</html>
