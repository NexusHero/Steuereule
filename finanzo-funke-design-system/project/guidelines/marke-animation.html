<!-- @dsCard group="Brand" viewport="700x210" name="Marken-Animation" subtitle="Kopf poppt, die Brille setzt sich auf, die Eule blinzelt einmal — Reload zum Abspielen" -->
<!DOCTYPE html>
<html lang="de">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body { padding: 0; display: flex; }
.b { flex: 1; display: flex; align-items: center; justify-content: center; gap: 18px; background: var(--nacht); min-height: 210px; }
.wort { font-family: var(--schrift-display); font-weight: 800; font-size: 32px; letter-spacing: -0.03em; color: var(--nacht-text); }
.wort b { color: var(--funke); }
.spec { flex: 1; padding: 24px; font-family: var(--schrift-mono); font-size: 11px; color: var(--tinte-2); line-height: 2; align-self: center; }
@media (prefers-reduced-motion: no-preference) {
  .fx-marke .au-kopf { opacity: 0; transform: scale(0.55); transform-box: fill-box; transform-origin: center; animation: au-pop 0.45s var(--feder) 0.1s forwards; }
  .fx-marke .au-brille { opacity: 0; transform: translateY(-16px); animation: au-auf 0.4s var(--feder) 0.55s forwards; }
  .fx-marke .au-lid { transform: scaleY(0); transform-box: fill-box; transform-origin: center top; animation: au-blinzeln 0.4s ease-in-out 1.3s; }
  .wort { opacity: 0; animation: funke-auftritt 0.45s var(--feder) 0.9s forwards; }
  @keyframes au-pop { to { opacity: 1; transform: none; } }
  @keyframes au-auf { to { opacity: 1; transform: none; } }
  @keyframes au-blinzeln { 0%, 100% { transform: scaleY(0); } 45% { transform: scaleY(1); } }
}
</style></head>
<body>
<div class="b">
  <svg class="fx-marke" viewBox="0 0 96 96" width="90" height="90" aria-hidden="true">
    <g class="au-kopf">
      <path d="M20 36 L30 10 L41 24 Z" fill="var(--funke)"></path>
      <path d="M76 36 L66 10 L55 24 Z" fill="var(--funke)"></path>
      <rect x="14" y="20" width="68" height="64" rx="30" fill="var(--funke)"></rect>
      <path d="M48 58 L55 65 L48 74 L41 65 Z" fill="var(--nacht)"></path>
    </g>
    <g class="au-brille">
      <rect x="42" y="44" width="12" height="6" rx="3" fill="var(--nacht)"></rect>
      <circle cx="33" cy="47" r="14" fill="var(--nacht)"></circle>
      <circle cx="63" cy="47" r="14" fill="var(--nacht)"></circle>
      <circle cx="36" cy="45" r="5.5" fill="var(--funke)"></circle>
      <circle cx="66" cy="45" r="5.5" fill="var(--funke)"></circle>
      <rect class="au-lid" x="19" y="33" width="28" height="28" rx="14" fill="var(--funke)"></rect>
      <rect class="au-lid" x="49" y="33" width="28" height="28" rx="14" fill="var(--funke)"></rect>
    </g>
  </svg>
  <span class="wort">Steuer<b>Eule</b></span>
</div>
<div class="spec">
  1 · Kopf: poppt, --feder, +100 ms<br>
  2 · Brille: setzt sich von oben auf, --feder, +550 ms<br>
  3 · Blinzeln: ein Lidschlag, +1,3 s<br>
  prefers-reduced-motion → statische Marke
</div>
</body>
</html>
