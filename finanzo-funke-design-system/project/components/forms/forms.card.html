<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body { padding: 20px; }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Input, Feld, Option, SchalterZeile } = window.FinanzoFunkeDesignSystem_7e417e;
function Demo() {
  const [mail, setMail] = React.useState('');
  const [wahl, setWahl] = React.useState('a');
  const [pro, setPro] = React.useState(true);
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24 }}>
      <div>
        <Feld label="E-Mail">
          <Input placeholder="du@beispiel.de" value={mail} onChange={setMail} />
        </Feld>
        <Feld label="IBAN" fehler="Bitte prüfen — 21 Stellen erwartet.">
          <Input value="DE89 3704" onChange={() => {}} />
        </Feld>
        <SchalterZeile titel="Pro-Simulation" detail="Unbegrenzte Berater-Fragen" an={pro} onChange={setPro} />
      </div>
      <div>
        <Option gewaehlt={wahl === 'a'} onClick={() => setWahl('a')}>Angestellt</Option>
        <Option gewaehlt={wahl === 'b'} onClick={() => setWahl('b')}>Selbstständig</Option>
        <Option gewaehlt={wahl === 'c'} onClick={() => setWahl('c')}>Grenzgänger (Schweiz)</Option>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
