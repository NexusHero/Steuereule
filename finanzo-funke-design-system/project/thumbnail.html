<!DOCTYPE html>
<html lang="de">
<head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>
html, body { margin: 0; width: 1280px; height: 854px; overflow: hidden; }
body { display: flex; }
.haupt { flex: 1; background: var(--funke); display: flex; align-items: center; justify-content: center; gap: 44px; }
.haupt img { width: 300px; height: 300px; }
.wort { font-family: var(--schrift-display); font-weight: 800; font-size: 128px; letter-spacing: -0.03em; color: #191b12; white-space: nowrap; }
.strip { width: 25%; height: 854px; display: flex; flex-direction: column; }
.strip i { flex: 1; display: block; }
</style></head>
<body>
<div class="haupt"><img src="assets/marke-tinte.svg" alt=""><span class="wort">SteuerEule</span></div>
<div class="strip">
  <i style="background: #e07b00;"></i>
  <i style="background: #1f9d55;"></i>
  <i style="background: #e0362c;"></i>
  <i style="background: #7c5cff;"></i>
</div>
</body>
</html>
