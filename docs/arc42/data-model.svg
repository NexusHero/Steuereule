<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="454px" preserveAspectRatio="none" style="width:1780px;height:454px;background:#FFFFFF;" version="1.1" viewBox="0 0 1780 454" width="1780px" zoomAndPan="magnify"><title>SteuerEule &#8212; Persistence Data Model &#183; arc42 &#167;5 (data view)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="472.4248" x="649.7876" y="22.9951">SteuerEule &#8212; Persistence Data Model &#183; arc42 &#167;5 (data view)</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="451.6025" x="660.1987" y="39.292">green = added by REQ-001 (Cockpit, steuereule#91/#92)</text><g id="elem_Nscope"><path d="M6,145.0938 L6,215.625 L494.2827,215.625 L494.2827,155.0938 L484.2827,145.0938 L6,145.0938 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M484.2827,145.0938 L484.2827,155.0938 L494.2827,155.0938 L484.2827,145.0938 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="380.8848" x="12" y="162.1606">userId is a logical scoping key, not a DB foreign key</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="79.9868" x="397.0171" y="162.1606">(ADR-0007).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="461.8809" x="12" y="177.2935">There is no User table &#8212; identity is the guest-session / verified-session</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="467.2827" x="12" y="192.4263">seam the UserContextGuard owns. Every row is read scoped to a single</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="392.1646" x="12" y="207.5591">userId; there are no cross-user joins between these entities.</text></g><!--class Profile--><g id="elem_Profile"><rect codeLine="22" fill="#F1F1F1" height="172.6719" id="Profile" rx="2.5" ry="2.5" style="stroke:#6B7280;stroke-width:0.5;" width="269.9473" x="512" y="94.0938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="44.085" x="624.9312" y="112.0889">Profile</text><line style="stroke:#6B7280;stroke-width:0.5;" x1="513" x2="780.9473" y1="120.3906" y2="120.3906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.1201" x="518" y="137.3857">id : uuid &#171;PK&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="166.9473" x="518" y="153.6826">userId : string &#171;unique&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.4658" x="518" y="169.9795">firstName : string</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="120.3604" x="518" y="186.2764">lastName : string</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="204.1416" x="518" y="202.5732">steuerId : string &#171;encrypted&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="257.9473" x="518" y="218.8701">steuernummer : string? &#171;encrypted&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="150.4727" x="518" y="235.167">createdAt : DateTime</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="155.0527" x="518" y="251.4639">updatedAt : DateTime</text><line style="stroke:#6B7280;stroke-width:0.5;" x1="513" x2="780.9473" y1="258.7656" y2="258.7656"/></g><g id="elem_GMN4"><path d="M417,354.0938 L417,424.625 A0,0 0 0 0 417,424.625 L877.334,424.625 A0,0 0 0 0 877.334,424.625 L877.334,364.0938 L867.334,354.0938 L651,354.0938 L647,267.2828 L643,354.0938 L417,354.0938 A0,0 0 0 0 417,354.0938 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M867.334,354.0938 L867.334,364.0938 L877.334,364.0938 L867.334,354.0938 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="337.6572" x="423" y="371.1606">steuerId / steuernummer are field-encrypted at rest</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="391.2124" x="423" y="386.2935">(ADR-0008 &#8212; AES-256-GCM, per-write nonce, mode=strict).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.4961" x="423" y="401.4263">Plain facts only otherwise &#8212; clean side of the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="439.334" x="423" y="416.5591">determinism boundary; @steuereule/core never recomputes these.</text></g><!--class TaxDataAccessLog--><g id="elem_TaxDataAccessLog"><rect codeLine="39" fill="#F1F1F1" height="137.75" id="TaxDataAccessLog" rx="2.5" ry="2.5" style="stroke:#6B7280;stroke-width:0.5;" width="262.5371" x="973.5" y="111.5938"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="89.5898" x="1059.9736" y="127.7324">&#171;append-only&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="132.2686" x="1038.6343" y="143.5576">TaxDataAccessLog</text><line style="stroke:#6B7280;stroke-width:0.5;" x1="974.5" x2="1235.0371" y1="151.8594" y2="151.8594"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.1201" x="979.5" y="168.8545">id : uuid &#171;PK&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174.9863" x="979.5" y="185.1514">userId : string &#171;indexed&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="114.9736" x="979.5" y="201.4482">resource : string</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="150.4727" x="979.5" y="217.7451">createdAt : DateTime</text><line style="stroke:#6B7280;stroke-width:0.5;" x1="974.5" x2="1235.0371" y1="225.0469" y2="225.0469"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="250.5371" x="979.5" y="242.042">action : AuditAction (READ | WRITE)</text></g><g id="elem_GMN8"><path d="M895.5,354.0938 L895.5,424.625 A0,0 0 0 0 895.5,424.625 L1314.771,424.625 A0,0 0 0 0 1314.771,424.625 L1314.771,364.0938 L1304.771,354.0938 L1109,354.0938 L1105,249.66 L1101,354.0938 L895.5,354.0938 A0,0 0 0 0 895.5,354.0938 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1304.771,354.0938 L1304.771,364.0938 L1314.771,364.0938 L1304.771,354.0938 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.0132" x="901.5" y="371.1606">DSGVO Art. 30 accountability trail (ADR-0008 / REQ-004).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="398.271" x="901.5" y="386.2935">Who/what/when only &#8212; no value column, never the plaintext</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="356.5859" x="901.5" y="401.4263">or ciphertext. Audited surface is identifier-class access</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.0366" x="901.5" y="416.5591">(Profile), not read-of-own-estimate (Cockpit).</text></g><!--class TaxYear--><g id="elem_TaxYear"><rect codeLine="53" fill="#98FB98" height="229.7109" id="TaxYear" rx="2.5" ry="2.5" style="stroke:#6B7280;stroke-width:0.5;" width="195.5713" x="1455" y="65.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="56.916" x="1524.3276" y="83.5889">TaxYear</text><line style="stroke:#6B7280;stroke-width:0.5;" x1="1456" x2="1649.5713" y1="91.8906" y2="91.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.1201" x="1461" y="108.8857">id : uuid &#171;PK&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.3574" x="1461" y="125.1826">userId : string</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="103.6055" x="1461" y="141.4795">steuerjahr : int</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="127.0801" x="1461" y="178.0732">baseEstimate : int</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.9707" x="1461" y="194.3701">openItems : int</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="127.21" x="1461" y="210.667">openConflicts : int</text><line style="stroke:#6B7280;stroke-width:1.0;stroke-dasharray:1.0,2.0;" x1="1456" x2="1498.9834" y1="156.9297" y2="156.9297"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="107.6045" x="1498.9834" y="161.2764">raw inputs only</text><line style="stroke:#6B7280;stroke-width:1.0;stroke-dasharray:1.0,2.0;" x1="1606.5879" x2="1649.5713" y1="156.9297" y2="156.9297"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="150.4727" x="1461" y="247.2607">createdAt : DateTime</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="155.0527" x="1461" y="263.5576">updatedAt : DateTime</text><line style="stroke:#6B7280;stroke-width:1.0;stroke-dasharray:1.0,2.0;" x1="1456" x2="1550.5605" y1="226.1172" y2="226.1172"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="1550.5605" y="230.4639">&#160;</text><line style="stroke:#6B7280;stroke-width:1.0;stroke-dasharray:1.0,2.0;" x1="1555.0107" x2="1649.5713" y1="226.1172" y2="226.1172"/><line style="stroke:#6B7280;stroke-width:0.5;" x1="1456" x2="1459" y1="279.0078" y2="279.0078"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="187.5713" x="1459" y="283.3545">unique (userId, steuerjahr)</text><line style="stroke:#6B7280;stroke-width:0.5;" x1="1646.5713" x2="1649.5713" y1="279.0078" y2="279.0078"/></g><g id="elem_GMN12"><path d="M1333,331.5938 L1333,447.5234 A0,0 0 0 0 1333,447.5234 L1773.0659,447.5234 A0,0 0 0 0 1773.0659,447.5234 L1773.0659,341.5938 L1763.0659,331.5938 L1557,331.5938 L1553,295.69 L1549,331.5938 L1333,331.5938 A0,0 0 0 0 1333,331.5938 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1763.0659,331.5938 L1763.0659,341.5938 L1773.0659,341.5938 L1763.0659,331.5938 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="41.4185" x="1339" y="348.6606">Stores</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="113.585" x="1384.5508" y="348.6606">raw inputs only</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.9209" x="1498.1357" y="348.6606">. The Cockpit refund-estimate</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="178.9087" x="1339" y="363.7935">range is never persisted</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214.3604" x="1522.041" y="363.7935">&#8212; recomputed on every read via</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="379.2852" x="1339" y="378.9263">@steuereule/core cockpitRange() (determinism boundary,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="330.2813" x="1339" y="394.0591">ADR-014/048), so there is no second place to drift.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="373.2993" x="1339" y="409.1919">No @encrypted field: ruled out of ADR-0008 scope (Musti</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.3149" x="1339" y="424.3247">review, R1a) &#8212; no tax identifier, only a rounded estimate</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="419.0659" x="1339" y="439.4575">and two counts. Revisit if assessed amounts / income land here.</text></g><!--SRC=[bLRRSXf747tdAphb1mF50bBakwoOI9IYn78KaErALQfSmsu3O-tER6PcGJX9LJuY_v1FoBi_9L-IqxC88wC7vq42vjANqwTFptqQiSdOSKPB7UPqaIiJNf-_lEzfKkay9DhGkE2WZA9ShMmLg5bMZkbxjL0jyfR2d6dyvfJukhGkDEwJOSuy6OkLmCwed4wTAkSB_Q6NsK3Q-A3odFxzyozoN3gRLQcUv8mDEZuZPJAo1XyhAbGwruQxZQzAfsR59W1VnmDNogK7-_JnxmVHsWKxhtrWap9bAYWgRCOvDUFtXUPbY-oqZZTmnMvOmUk5zM7cs9DFvroeBgoERULW0cSTfzPbDBKkNikqcZbLF5ldIi56Fqdqq_MB6JKzCus6WvFpOKjCVQTdynn_0VWsuOPDYvwJoZBydgnmygUatz_3jHWG8w1xJ_Pwzvxijxfqhfs3OpkLHClIzrIfUwNJlb2zTR3rhvZy5NCPWmnBAr32OYbs5NAiONfEKwLpRMOKs0U4DzSPKwfTcdF3NsbJAYH7QQwy7uJWzAGAV9PQCzOVcFfRH_nSPNOfbgOgzpkNlmLcx8vjZkZlFPmysd_SRpI23laju3-ls8bKwJnMxEC_MvNTAjyl9a9u9uB7DhqgTUZGBfIDXh41A7XwvLDRSeEetQuykxECj2Vmoivq2fxAhcHrnQiE21omTVAjL9_rpCXgkqtDmSa87lkF023HvHokn0Ze_XeMAQZ9EZU0Qv3qIdQbBhCAg2UUlTVWTuyMxFHKStQp16kU0Q6S5LF7rWHqq6cbm42xDBvBGznPaRDBiUbOPJ5Y004YAl88FPVawjIUYIKdnMU9BdNM-qIswBr53zA4mrB0n2dF56FLxBiDo87aper6B2PTE3lLoEatMDOPFQMgmiVXuSKFHqSRPrZsO0