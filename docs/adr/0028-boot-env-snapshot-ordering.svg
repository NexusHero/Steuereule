mily="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="297.4619" x="1374.0625" y="610.2261">[NODE_ENV=production and something arrived]</text><ellipse cx="1698.7246" cy="665.7969" fill="#000000" rx="4" ry="4" style="stroke:#181818;stroke-width:1.5;"/><polygon fill="#181818" points="1681.7246,662.5469,1691.7246,666.5469,1681.7246,670.5469,1685.7246,666.5469" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="1355.8374" x2="1687.7246" y1="666.5469" y2="666.5469"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.6558" x="1362.8374" y="631.2153">refuse to start &#8212;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.8032" x="1362.8374" y="646.3481">name the variables and the file,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.1543" x="1362.8374" y="661.481">never the values</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="1294.6196" x2="1697.2246" y1="675.5469" y2="675.5469"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="71.5269" x="1299.6196" y="685.7573">[otherwise]</text><line style="stroke:#181818;stroke-width:1.0;" x1="1355.8374" x2="1397.8374" y1="710.4844" y2="710.4844"/><line style="stroke:#181818;stroke-width:1.0;" x1="1397.8374" x2="1397.8374" y1="710.4844" y2="723.4844"/><line style="stroke:#181818;stroke-width:1.0;" x1="1356.8374" x2="1397.8374" y1="723.4844" y2="723.4844"/><polygon fill="#181818" points="1366.8374,719.4844,1356.8374,723.4844,1366.8374,727.4844,1362.8374,723.4844" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="312.3872" x="1362.8374" y="705.4185">no-op (F6: never reject a working configuration)</text><rect fill="#DDDDDD" height="107.7813" id="_legend" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1.0;" width="349.541" x="1344.6836" y="808.0781"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="339.541" x="1349.6836" y="826.0732">Swap imports 1 and 2 and the snapshot is taken</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="327.0723" x="1349.6836" y="842.3701">AFTER the merge: nothing looks like it arrived,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="323.4492" x="1349.6836" y="858.667">the guard goes blind, and the process runs on</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="132.3438" x="1349.6836" y="874.9639">values nobody set.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="282.5566" x="1349.6836" y="891.2607">That is the control proof (ADR-0021) the</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="270.4502" x="1349.6836" y="907.5576">acceptance suite runs as its own case.</text><!--SRC=[RLLDR-Cs4BthLqptKXk8aqqERR505lKs3b1WumH9sbvI12DfP753aIn9oN1FFVK75Fs5-qlwIDcE7VGIX-IRhpTlHjyupwkEIVF6zf529v4D5r55BJI_kf-zVt_n0ttzwrzQjnkAhL0mx49h8tLzY5HAlXGJ_OQSLIP-6wXH7a-gSzR7eWWloZZst55ekRPhPLRKi0voy59BmxsErzR49NS8mYRCWdZL79hB7xsOIcua15x9NAkL8IqDOW0GLQKScqZlZAtboKmwM_SeGWRMFKTbpVGTSQ0bNe_nbJMDMfs96MQxuavZoE07d8_1xDpfw1cO9_Frxt_epglGyOFuGLMIpURkZTMFBcFEAgr0LSQCLiSmvss5uawHIiOip70CAAsD8Nfsax6OJpWNnUKbtRmjDlTiR44WtnjIXeBjVILaVIsUBY-B8d51iu-vJFgmXTCvJMhHgXJFKVI6k1MkoJR4shLS2j9XFNgP5bn5DG0tKfKTmI4IXp-Vx9oNaBgM72IfV4-hdc5Raq6dGv6WizSS4iIw5DfwICck3OtzwNskgp0MmRnQjJ5vp569xkuN3ulbu_EdnVNj_UBvxlxdXvlvyq-tlto-UlvyExy2fF7sJp7KYfSJiaYe48CSuAsevRYAFI_euoij5pHPsrxNe16dhF63ybFB4nnMOsV7-giMXV9k62WgY7jGVAoPLozRKMmzx8dinAym573MyOphBrn1HGGfXZDswYpf1OBVnWWAoKlJ