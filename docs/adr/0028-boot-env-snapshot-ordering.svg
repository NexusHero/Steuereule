,1170.0186,375.2188" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="898.8447" x2="1172.0186" y1="375.2188" y2="375.2188"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.1738" x="905.8447" y="355.02">merge schema-adjacent apps/api/.env</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.2256" x="905.8447" y="370.1528">(import side effect, fill-only)</text><path d="M1183,388.2188 L1183,428.2188 L1418,428.2188 L1418,398.2188 L1408,388.2188 L1183,388.2188 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1408,388.2188 L1408,398.2188 L1418,398.2188 L1408,388.2188 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214.5952" x="1189" y="405.2856">Whatever the operator left unset</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.4722" x="1189" y="420.4185">is now silently supplied by a file.</text><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1.0;" width="1707.2246" x="0" y="454.0508"/><line style="stroke:#000000;stroke-width:1.0;" x1="0" x2="1707.2246" y1="454.0508" y2="454.0508"/><line style="stroke:#000000;stroke-width:1.0;" x1="0" x2="1707.2246" y1="457.0508" y2="457.0508"/><rect fill="#EEEEEE" height="23.1328" style="stroke:#000000;stroke-width:2.0;" width="412.2583" x="647.4832" y="443.4844"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="393.7324" x="653.4832" y="459.5513">bootstrap() &#8212; after everything above has already run</text><polygon fill="#181818" points="1333.8374,478.6172,1343.8374,482.6172,1333.8374,486.6172,1337.8374,482.6172" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="82.7383" x2="1339.8