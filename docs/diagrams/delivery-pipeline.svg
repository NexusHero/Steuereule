<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="1024px" preserveAspectRatio="none" style="width:502px;height:1024px;background:#FFFFFF;" version="1.1" viewBox="0 0 502 1024" width="502px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><!--entity A--><g class="entity" data-qualified-name="A" data-source-line="5" id="ent0001"><rect fill="#FFFFFF" height="65.9316" rx="7" ry="7" style="stroke:#C6C6CC;stroke-width:1;" width="316.6895" x="98.14" y="7"/><text fill="#0F0F14" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.8926" x="108.14" y="29.5684">Suhay + Musti &#183; joint grilling</text><text fill="#0F0F14" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" lengthAdjust="spacing" textLength="296.6895" x="108.14" y="44.8789">refinement block: REQ, one Given-When-Then,</text><text fill="#0F0F14" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.2236" x="108.14" y="60.1895">ADR check, scope, honesty check, risk tier</text></g><!--entity A2--><g class="entity" data-qualified-name="A2" data-source-line="6" id="ent0002"><rect fill="#FFFFFF" height="35.3105" rx="7" ry="7" style="stroke:#C6C6CC;stroke-width:1;" width="212.3149" x="150.33" y="133.93"/><text fill="#0F0F14" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.3149" x="160.33" y="156.4984">Stakeholder rules on the block</text></g><!--entity B--><g class="entity" data-qualified-name="B" data-source-line="7" id="ent0003"><rect fill="#FFFFFF" height="50.6211" rx="7" ry="7" style="stroke:#C6C6CC;stroke-width:1;" width="155.6304" x="178.67" y="230.24"/><text fill="#0F0F14" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" lengthAdjust="spacing" textLength="76.3877" x="188.67" y="252.8084">Musti &#183; Lead</text><text fill="#0F0F14" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.6304" x="188.67" y="268.1189">break down, dispatch</text></g><!--entity C--><g class="entity" data-qualified-name="C" data-source-line="8" id="ent0004"><rect fill="#FFFFFF" height="50.6211" rx="7" ry="7" style="stroke:#C6C6CC;stroke-width:1;" width="260.481" x="126.24" y="341.86"/><text fill="#0F0F14" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.2188" x="136.24" y="364.4284">Kaan / Robin &#183; Dev</text><text fill="#0F0F14" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" lengthAdjust="spacing" textLength="240.481" x="136.24" y="379.7389">implement tests-first, own gate green</text></g><!--entity D--><g class="entity" data-qualified-name="D" data-source-line="9" id="ent0005"><rect fill="#FFFFFF" height="50.6211" rx="7" ry="7" style="stroke:#C6C6CC;stroke-width:1;" width="162.9683" x="7" y="453.48"/><text fill="#0F0F14" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.9683" x="17" y="476.0484">Dev opens a DRAFT PR</text><text fill="#0F0F14" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.8838" x="17" y="491.3589">CI starts running here</text></g><!--entity E--><g class="entity" data-qualified-name="E" data-source-line="10" id="ent0006"><rect fill="#FFFFFF" height="65.9316" rx="7" ry="7" style="stroke:#C6C6CC;stroke-width:1;" width="334.9707" x="39" y="580.11"/><text fill="#0F0F14" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" lengthAdjust="spacing" textLength="76.3877" x="49" y="602.6784">Musti &#183; Lead</text><text fill="#0F0F14" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.9707" x="49" y="617.9889">reviews on the draft, comments in public as Musti</text><text fill="#0F0F14" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" lengthAdjust="spacing" textLength="280.5537" x="49" y="633.2995">posts his record even when he finds nothing</text></g><!--entity F--><g class="entity" data-qualified-name="F" data-source-line="11" id="ent0007"><rect fill="#FFFFFF" height="65.9316" rx="7" ry="7" style="stroke:#C6C6CC;stroke-width:1;" width="216.5615" x="208.2" y="722.04"/><text fill="#0F0F14" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" lengthAdjust="spacing" textLength="61.1724" x="218.2" y="744.6084">Salih &#183; QA</text><text fill="#0F0F14" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.5615" x="218.2" y="759.9189">tests per risk tier: T3 not at all,</text><text fill="#0F0F14" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.1196" x="218.2" y="775.2295">T2 if user-visible, T1 in full</text></g><!--entity G--><g class="entity" data-qualified-name="G" data-source-line="12" id="ent0008"><rect fill="#FFFFFF" height="50.6211" rx="7" ry="7" style="stroke:#C6C6CC;stroke-width:1;" width="183.2554" x="224.86" y="863.97"/><text fill="#0F0F14" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.2554" x="234.86" y="886.5384">Salih posts his test record</text><text fill="#0F0F14" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.5986" x="234.86" y="901.8489">and flips the PR to READY</text></g><!--entity H--><g class="entity" data-qualified-name="H" data-source-line="13" id="ent0009"><rect fill="#FFFFFF" height="35.3105" rx="7" ry="7" style="stroke:#C6C6CC;stroke-width:1;" width="344.0542" x="144.46" y="975.59"/><text fill="#0F0F14" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" lengthAdjust="spacing" textLength="324.0542" x="154.46" y="998.1584">Stakeholder &#183; final human pass on GitHub &#8594; merge</text></g><!--link A to A2--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="15" id="lnk10"><path d="M256.48,73.26 C256.48,93.09 256.48,112.68 256.48,128.74" fill="none" id="A-to-A2" style="stroke:#0F0F14;stroke-width:1;"/><polygon fill="#0F0F14" points="256.48,133.74,260.48,124.74,256.48,128.74,252.48,124.74,256.48,133.74" style="stroke:#0F0F14;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link A2 to B--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="16" id="lnk11"><path d="M256.48,169.42 C256.48,185.94 256.48,206.31 256.48,225.06" fill="none" id="A2-to-B" style="stroke:#0F0F14;stroke-width:1;"/><polygon fill="#0F0F14" points="256.48,230.06,260.48,221.06,256.48,225.06,252.48,221.06,256.48,230.06" style="stroke:#0F0F14;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link B to C--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="17" id="lnk12"><path d="M256.48,281.15 C256.48,299.21 256.48,318.62 256.48,336.65" fill="none" id="B-to-C" style="stroke:#0F0F14;stroke-width:1;"/><polygon fill="#0F0F14" points="256.48,341.65,260.48,332.65,256.48,336.65,252.48,332.65,256.48,341.65" style="stroke:#0F0F14;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link C to D--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="18" id="lnk13"><path d="M218.78,392.77 C191.21,410.77 158.1471,432.3372 130.5371,450.3572" f