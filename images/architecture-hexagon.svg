<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="title desc">
  <title id="title">Steuereule: Ports and Adapters (hexagonal architecture)</title>
  <desc id="desc">The pure domain core @steuereule/core sits in the centre, surrounded by the application services of apps/api. Ports on the edge of the ring are TypeScript interfaces with DI tokens. Driving adapters on the left (web app, AI assistants over MCP, the payment webhook) call in; driven adapters on the right (PostgreSQL via Prisma, language models via LangChain, Stripe, e-mail, file storage and PDF export) implement ports. Every dependency points inward. Two architecture tests enforce this.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#191B12"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #191B12; }
      .mono { font-family: "JetBrains Mono", SFMono-Regular, Menlo, Consolas, monospace; }
      .h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
      .sub { font-size: 15px; fill: #4A4D3F; }
      .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 1.6px; }
      .title { font-size: 15px; font-weight: 800; }
      .line { font-size: 12px; fill: #33362A; }
      .port { font-size: 11px; fill: #5B21B6; }
      .portL { font-size: 11px; fill: #1E4E8C; }
      .edge { font-size: 10.5px; font-style: italic; fill: #4A4D3F; }
      .box { stroke: #191B12; stroke-width: 2.5; }
      .shadow { fill: #191B12; }
    </style>
  </defs>

  <!-- canvas -->
  <rect x="2" y="2" width="1196" height="776" rx="22" fill="#FBFAF5" stroke="#191B12" stroke-width="3"/>

  <!-- header -->
  <text x="40" y="58" class="h1">SteuerEule · Ports &amp; Adapters</text>
  <text x="40" y="86" class="sub">A pure tax core, use cases around it, the database and every SDK in named adapter files. Dependencies point inward.</text>

  <!-- column headings -->
  <text x="40" y="276" class="eyebrow" fill="#1E4E8C">DRIVING ADAPTERS · CALL IN</text>
  <text x="1170" y="182" text-anchor="end" class="eyebrow">DRIVEN ADAPTERS · IMPLEMENT</text>

  <!-- application ring (outer hexagon, flat-top, r=250, centre 600/430) -->
  <polygon points="858,436 733,652.5 483,652.5 358,436 483,219.5 733,219.5" class="shadow"/>
  <polygon points="850,430 725,646.5 475,646.5 350,430 475,213.5 725,213.5" fill="#EEF3DA" class="box" stroke-width="3"/>
  <text x="600" y="258" text-anchor="middle" class="eyebrow">APPLICATION SERVICES</text>
  <text x="600" y="280" text-anchor="middle" class="line mono">apps/api/src/&lt;module&gt;/*.service.ts</text>
  <text x="600" y="298" text-anchor="middle" class="line">use cases · orchestration · audit</text>

  <!-- domain core (inner hexagon, r=125) -->
  <polygon points="731,436 668.5,544 543.5,544 481,436 543.5,328 668.5,328" class="shadow"/>
  <polygon points="725,430 662.5,538 537.5,538 475,430 537.5,322 662.5,322" fill="#C9F229" class="box" stroke-width="3"/>
  <text x="600" y="372" text-anchor="middle" class="eyebrow">DOMAIN CORE</text>
  <text x="600" y="398" text-anchor="middle" style="font-size:20px;font-weight:800">@steuereule/core</text>
  <text x="600" y="425" text-anchor="middle" class="line" style="font-size:13.5px">math · engine · domains</text>
  <text x="600" y="444" text-anchor="middle" class="line" style="font-size:13.5px">interview · common</text>
  <text x="600" y="474" text-anchor="middle" class="line">pure TypeScript · no I/O</text>
  <text x="600" y="491" text-anchor="middle" class="line">no npm dependencies</text>

  <!-- ring footer -->
  <text x="600" y="580" text-anchor="middle" class="eyebrow" fill="#5B21B6">PORTS</text>
  <text x="600" y="600" text-anchor="middle" class="line">TypeScript interfaces + DI tokens</text>
  <text x="600" y="617" text-anchor="middle" class="line mono" style="font-size:11px">RECEIPT_REPOSITORY · KI_PORT</text>

  <!-- ===== driven adapters (right) ===== -->
  <!-- 1 PostgreSQL, y=238 -->
  <rect x="936" y="202" width="240" height="84" rx="12" class="shadow"/>
  <rect x="930" y="196" width="240" height="84" rx="12" fill="#F3E8FF" class="box"/>
  <text x="946" y="221" class="title">PostgreSQL</text>
  <text x="946" y="241" class="line">Prisma · AES-256-GCM fields</text>
  <text x="946" y="263" class="port mono">*.repository.prisma.ts</text>
  <line x1="930" y1="238" x2="752" y2="238" stroke="#191B12" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="842" y="230" text-anchor="middle" class="edge">implements</text>
  <circle cx="739" cy="238" r="9" fill="#5B21B6" stroke="#191B12" stroke-width="2.5"/>

  <!-- 2 Language models, y=334 -->
  <rect x="936" y="298" width="240" height="84" rx="12" class="shadow"/>
  <rect x="930" y="292" width="240" height="84" rx="12" fill="#F3E8FF" class="box"/>
  <text x="946" y="317" class="title">Language models</text>
  <text x="946" y="337" class="line">Anthropic · OpenAI · Gemini</text>
  <text x="946" y="359" class="port mono">LangChain: 8 named files</text>
  <line x1="930" y1="334" x2="808" y2="334" stroke="#191B12" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="795" cy="334" r="9" fill="#5B21B6" stroke="#191B12" stroke-width="2.5"/>

  <!-- 3 Payments, y=430 -->
  <rect x="936" y="394" width="240" height="84" rx="12" class="shadow"/>
  <rect x="930" y="388" width="240" height="84" rx="12" fill="#F3E8FF" class="box"/>
  <text x="946" y="413" class="title">Payments</text>
  <text x="946" y="433" class="line">Stripe Checkout + webhooks</text>
  <text x="946" y="455" class="port mono">PaymentProvider</text>
  <line x1="930" y1="430" x2="863" y2="430" stroke="#191B12" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="850" cy="430" r="9" fill="#5B21B6" stroke="#191B12" stroke-width="2.5"/>

  <!-- 4 E-mail, y=526 -->
  <rect x="936" y="490" width="240" height="84" rx="12" class="shadow"/>
  <rect x="930" y="484" width="240" height="84" rx="12" fill="#F3E8FF" class="box"/>
  <text x="946" y="509" class="title">E-mail</text>
  <text x="946" y="529" class="line">SMTP · Brevo · log sink</text>
  <text x="946" y="551" class="port mono">EmailSender</text>
  <line x1="930" y1="526" x2="808" y2="526" stroke="#191B12" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="795" cy="526" r="9" fill="#5B21B6" stroke="#191B12" stroke-width="2.5"/>

  <!-- 5 Documents, y=622 -->
  <rect x="936" y="586" width="240" height="84" rx="12" class="shadow"/>
  <rect x="930" y="580" width="240" height="84" rx="12" fill="#F3E8FF" class="box"/>
  <text x="946" y="605" class="title">Files &amp; PDF export</text>
  <text x="946" y="625" class="line">encrypted store · Playwright</text>
  <text x="946" y="647" class="port mono">StoragePort · PdfRenderer</text>
  <line x1="930" y1="622" x2="752" y2="622" stroke="#191B12" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="739" cy="622" r="9" fill="#5B21B6" stroke="#191B12" stroke-width="2.5"/>

  <!-- ===== driving adapters (left) ===== -->
  <!-- 1 Web app, y=334 -->
  <rect x="36" y="298" width="240" height="84" rx="12" class="shadow"/>
  <rect x="30" y="292" width="240" height="84" rx="12" fill="#DCEBFF" class="box"/>
  <text x="46" y="317" class="title">Web &amp; mobile app</text>
  <text x="46" y="337" class="line">Expo · typed @steuereule/api-client</text>
  <text x="46" y="359" class="portL mono">REST controllers /v1/*</text>
  <line x1="270" y1="334" x2="392" y2="334" stroke="#191B12" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="331" y="326" text-anchor="middle" class="edge">calls</text>
  <circle cx="405" cy="334" r="9" fill="#1E4E8C" stroke="#191B12" stroke-width="2.5"/>

  <!-- 2 AI assistants, y=430 -->
  <rect x="36" y="394" width="240" height="84" rx="12" class="shadow"/>
  <rect x="30" y="388" width="240" height="84" rx="12" fill="#DCEBFF" class="box"/>
  <text x="46" y="413" class="title">AI assistants</text>
  <text x="46" y="433" class="line">OAuth 2.1 · scoped MCP tools</text>
  <text x="46" y="455" class="portL mono">McpController /mcp</text>
  <line x1="270" y1="430" x2="337" y2="430" stroke="#191B12" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="350" cy="430" r="9" fill="#1E4E8C" stroke="#191B12" stroke-width="2.5"/>

  <!-- 3 Jobs, y=526 -->
  <rect x="36" y="490" width="240" height="84" rx="12" class="shadow"/>
  <rect x="30" y="484" width="240" height="84" rx="12" fill="#DCEBFF" class="box"/>
  <text x="46" y="509" class="title">Payment webhook</text>
  <text x="46" y="529" class="line">Stripe events, signature-checked</text>
  <text x="46" y="551" class="portL mono">POST /v1/zahlung/stripe/webhook</text>
  <line x1="270" y1="526" x2="392" y2="526" stroke="#191B12" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="405" cy="526" r="9" fill="#1E4E8C" stroke="#191B12" stroke-width="2.5"/>

  <!-- legend -->
  <line x1="40" y1="694" x2="1160" y2="694" stroke="#191B12" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="40" y1="728" x2="84" y2="728" stroke="#191B12" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="96" y="732" class="line" style="font-size:13px">dependency (always inward)</text>
  <circle cx="300" cy="728" r="8" fill="#5B21B6" stroke="#191B12" stroke-width="2.5"/>
  <circle cx="322" cy="728" r="8" fill="#1E4E8C" stroke="#191B12" stroke-width="2.5"/>
  <text x="340" y="732" class="line" style="font-size:13px">port (interface + DI token)</text>
  <rect x="560" y="712" width="600" height="34" rx="8" fill="#191B12"/>
  <text x="576" y="734" style="font-size:13px;font-weight:700;fill:#C9F229">ENFORCED</text>
  <text x="656" y="734" style="font-size:12.5px;fill:#FBFAF5">architecture.test.ts in core and in api · ADR-0102</text>
</svg>
