<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="title desc">
  <title id="title">Steuereule: Ports and Adapters (hexagonal architecture)</title>
  <desc id="desc">The pure domain core @steuereule/core sits in the centre, surrounded by the application services of apps/api. Ports on the edge of the ring are TypeScript interfaces with DI tokens. Driving adapters on the left (web app, AI assistants over MCP, the payment webhook) call in; driven adapters on the right (PostgreSQL via Prisma, language models via LangChain, Stripe, e-mail, file storage and PDF export) implement ports. Every dependency points inward. Two architecture tests enforce this.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1.5 L9,5 L1,8.5" fill="none" class="arrow-head"/>
    </marker>
    <style>
      /* Shape and type: the app's tokens (packages/tokens/dist/tokens.css). */
      text { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono, .eyebrow, .edge-label { font-family: "Geist Mono", ui-monospace, Menlo, monospace; }
      .h1 { font-size: 34px; font-weight: 600; letter-spacing: -0.03em; }
      .sub { font-size: 16px; }
      .eyebrow { font-size: 12px; letter-spacing: 0.08em; }
      .title { font-size: 16px; font-weight: 600; }
      .line { font-size: 12.5px; }
      .port { font-size: 11px; }
      .edge-label { font-size: 10.5px; letter-spacing: 0.08em; }
      .canvas, .card, .ring, .core, .pill, .port-dot, .rule { stroke-width: 1; }
      .edge { stroke-width: 1.25; }
      .arrow-head { stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      /* Colour: the light theme, written out because not every SVG renderer knows custom properties. */
      text { fill: #0f0f14; }
      .sub, .eyebrow, .line, .edge-label { fill: #5c5c66; }
      .port { fill: #0f0f14; }
      .canvas { fill: #ffffff; stroke: #c6c6cc; }
      .card { fill: #ffffff; stroke: #0f0f14; }
      .chip { fill: #f3f3f5; }
      .ring { fill: #f2fbd2; stroke: #0f0f14; }
      .core, .pill, .port-dot { fill: #c9f229; stroke: #0f0f14; }
      .edge, .arrow-head { stroke: #0f0f14; }
      .rule { stroke: #e6e6e9; }
      /* The "dunkel" theme, when the reader's system is dark. */
      @media (prefers-color-scheme: dark) {
        text { fill: #ededf3; }
        .sub, .eyebrow, .line, .edge-label { fill: #a0a0ac; }
        .port { fill: #ededf3; }
        .canvas { fill: #0f0f14; stroke: #3c3c45; }
        .card { fill: #191920; stroke: #ededf3; }
        .chip { fill: #1f1f27; }
        .ring { fill: #262d10; stroke: #ededf3; }
        .core, .pill, .port-dot { fill: #c9f229; stroke: #ededf3; }
        .edge, .arrow-head { stroke: #ededf3; }
        .rule { stroke: #27272e; }
      }
      /* On the lime the text is ink in both themes, as on the app's selected chip. Last, so it wins. */
      text.on-funke { fill: #0f0f14; }
      text.on-funke-2 { fill: #40510a; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="779" rx="20" class="canvas"/>

  <!-- header -->
  <text x="40" y="52" class="eyebrow">ARCHITECTURE</text>
  <text x="40" y="92" class="h1">Ports &amp; Adapters</text>
  <text x="40" y="122" class="sub">A pure tax core, use cases around it, the database and every SDK in named adapter files. Dependencies point inward.</text>

  <!-- column headings -->
  <text x="30" y="282" class="eyebrow">DRIVING ADAPTERS · CALL IN</text>
  <text x="1170" y="186" text-anchor="end" class="eyebrow">DRIVEN ADAPTERS · IMPLEMENT</text>

  <!-- application ring and domain core: flat-top hexagons around 600/436 -->
  <path d="M839.0,416.9 Q850.0,436.0 839.0,455.1 L736.0,633.5 Q725.0,652.5 703.0,652.5 L497.0,652.5 Q475.0,652.5 464.0,633.5 L361.0,455.1 Q350.0,436.0 361.0,416.9 L464.0,238.5 Q475.0,219.5 497.0,219.5 L703.0,219.5 Q725.0,219.5 736.0,238.5 Z" class="ring"/>
  <text x="600" y="262" text-anchor="middle" class="eyebrow">APPLICATION SERVICES</text>
  <text x="600" y="284" text-anchor="middle" class="mono port">apps/api/src/&lt;module&gt;/*.service.ts</text>
  <text x="600" y="303" text-anchor="middle" class="line">use cases · orchestration · audit</text>

  <path d="M717.0,422.1 Q725.0,436.0 717.0,449.9 L670.5,530.4 Q662.5,544.3 646.5,544.3 L553.5,544.3 Q537.5,544.3 529.5,530.4 L483.0,449.9 Q475.0,436.0 483.0,422.1 L529.5,341.6 Q537.5,327.7 553.5,327.7 L646.5,327.7 Q662.5,327.7 670.5,341.6 Z" class="core"/>
  <text x="600" y="378" text-anchor="middle" class="eyebrow on-funke-2">DOMAIN CORE</text>
  <text x="600" y="406" text-anchor="middle" class="on-funke" style="font-size:21px;font-weight:600;letter-spacing:-0.03em">@steuereule/core</text>
  <text x="600" y="432" text-anchor="middle" class="on-funke" style="font-size:13.5px">math · engine · domains</text>
  <text x="600" y="451" text-anchor="middle" class="on-funke" style="font-size:13.5px">interview · common</text>
  <text x="600" y="480" text-anchor="middle" class="on-funke-2" style="font-size:12.5px">pure TypeScript · no I/O</text>
  <text x="600" y="497" text-anchor="middle" class="on-funke-2" style="font-size:12.5px">no npm dependencies</text>

  <text x="600" y="588" text-anchor="middle" class="eyebrow">PORTS</text>
  <text x="600" y="608" text-anchor="middle" class="line">TypeScript interfaces + DI tokens</text>
  <text x="600" y="627" text-anchor="middle" class="mono port">RECEIPT_REPOSITORY · KI_PORT</text>

  <!-- driven adapters (right) -->
  <rect x="930" y="202" width="240" height="84" rx="14" class="card"/>
  <text x="946" y="229" class="title">PostgreSQL</text>
  <text x="946" y="248" class="line">Prisma · AES-256-GCM fields</text>
  <rect x="942" y="258" width="167" height="20" rx="10" class="chip"/>
  <text x="952" y="272" class="mono port">*.repository.prisma.ts</text>
  <line x1="930" y1="244" x2="752" y2="244" class="edge" marker-end="url(#arrow)"/>
  <circle cx="739" cy="244" r="6" class="port-dot"/>
  <text x="842" y="235" text-anchor="middle" class="edge-label">implements</text>
  <rect x="930" y="298" width="240" height="84" rx="14" class="card"/>
  <text x="946" y="325" class="title">Language models</text>
  <text x="946" y="344" class="line">Anthropic · OpenAI · Gemini</text>
  <rect x="942" y="354" width="188" height="20" rx="10" class="chip"/>
  <text x="952" y="368" class="mono port">LangChain, in named files</text>
  <line x1="930" y1="340" x2="808" y2="340" class="edge" marker-end="url(#arrow)"/>
  <circle cx="795" cy="340" r="6" class="port-dot"/>
  <rect x="930" y="394" width="240" height="84" rx="14" class="card"/>
  <text x="946" y="421" class="title">Payments</text>
  <text x="946" y="440" class="line">Stripe Checkout + webhooks</text>
  <rect x="942" y="450" width="120" height="20" rx="10" class="chip"/>
  <text x="952" y="464" class="mono port">PaymentProvider</text>
  <line x1="930" y1="436" x2="863" y2="436" class="edge" marker-end="url(#arrow)"/>
  <circle cx="850" cy="436" r="6" class="port-dot"/>
  <rect x="930" y="490" width="240" height="84" rx="14" class="card"/>
  <text x="946" y="517" class="title">E-mail</text>
  <text x="946" y="536" class="line">SMTP · Brevo · log sink</text>
  <rect x="942" y="546" width="94" height="20" rx="10" class="chip"/>
  <text x="952" y="560" class="mono port">EmailSender</text>
  <line x1="930" y1="532" x2="808" y2="532" class="edge" marker-end="url(#arrow)"/>
  <circle cx="795" cy="532" r="6" class="port-dot"/>
  <rect x="930" y="586" width="240" height="84" rx="14" class="card"/>
  <text x="946" y="613" class="title">Files &amp; PDF export</text>
  <text x="946" y="632" class="line">encrypted store · Playwright</text>
  <rect x="942" y="642" width="188" height="20" rx="10" class="chip"/>
  <text x="952" y="656" class="mono port">StoragePort · PdfRenderer</text>
  <line x1="930" y1="628" x2="752" y2="628" class="edge" marker-end="url(#arrow)"/>
  <circle cx="739" cy="628" r="6" class="port-dot"/>

  <!-- driving adapters (left) -->
  <rect x="30" y="298" width="240" height="84" rx="14" class="card"/>
  <text x="46" y="325" class="title">Web &amp; mobile app</text>
  <text x="46" y="344" class="line">Expo · typed @steuereule/api-client</text>
  <rect x="42" y="354" width="167" height="20" rx="10" class="chip"/>
  <text x="52" y="368" class="mono port">REST controllers /v1/*</text>
  <line x1="270" y1="340" x2="392" y2="340" class="edge" marker-end="url(#arrow)"/>
  <circle cx="405" cy="340" r="6" class="port-dot"/>
  <text x="331" y="331" text-anchor="middle" class="edge-label">calls</text>
  <rect x="30" y="394" width="240" height="84" rx="14" class="card"/>
  <text x="46" y="421" class="title">AI assistants</text>
  <text x="46" y="440" class="line">OAuth 2.1 · scoped MCP tools</text>
  <rect x="42" y="450" width="141" height="20" rx="10" class="chip"/>
  <text x="52" y="464" class="mono port">McpController /mcp</text>
  <line x1="270" y1="436" x2="337" y2="436" class="edge" marker-end="url(#arrow)"/>
  <circle cx="350" cy="436" r="6" class="port-dot"/>
  <rect x="30" y="490" width="240" height="84" rx="14" class="card"/>
  <text x="46" y="517" class="title">Payment webhook</text>
  <text x="46" y="536" class="line">Stripe events, signature-checked</text>
  <rect x="42" y="546" width="228" height="20" rx="10" class="chip"/>
  <text x="52" y="560" class="mono port">POST /v1/zahlung/stripe/webhook</text>
  <line x1="270" y1="532" x2="392" y2="532" class="edge" marker-end="url(#arrow)"/>
  <circle cx="405" cy="532" r="6" class="port-dot"/>

  <!-- legend -->
  <line x1="40" y1="700" x2="1160" y2="700" class="rule"/>
  <line x1="40" y1="736" x2="84" y2="736" class="edge" marker-end="url(#arrow)"/>
  <text x="96" y="740" class="line" style="font-size:13px">dependency (always inward)</text>
  <circle cx="306" cy="736" r="6" class="port-dot"/>
  <text x="322" y="740" class="line" style="font-size:13px">port (interface + DI token)</text>
  <rect x="644" y="722" width="104" height="28" rx="14" class="pill"/>
  <text x="696" y="740.5" text-anchor="middle" class="mono on-funke" style="font-size:11.5px;letter-spacing:0.08em">ENFORCED</text>
  <text x="762" y="740" class="line" style="font-size:13px">architecture.test.ts in core and in api · ADR-0102</text>
</svg>
