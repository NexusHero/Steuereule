# Local/E2E stack (ADR-0010). A real postgres:16 service — the PO's one-command local
# database — replaces the earlier idle `baseline` placeholder container:
#   docker compose up -d
# Then apply migrations and load the synthetic seed fixture (ADR-0003) against it:
#   DATABASE_URL=postgresql://steuereule:steuereule@localhost:5432/steuereule \
#     pnpm --filter @steuereule/api migrate:deploy
#   DATABASE_URL=postgresql://steuereule:steuereule@localhost:5432/steuereule \
#     pnpm --filter @steuereule/api prisma db seed
# CI's `integration`/`smoke` jobs use a GitHub Actions Postgres service container instead
# (faster — no image build/orchestration for a process that runs natively on the
# runner, ADR-0010) but pin the same `postgres:16` image family, so this compose stack
# and CI stay dev/CI/prod-shape parity (12-Factor X). The `ci`/`e2e` overlays layer on
# top of this base.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: steuereule
      POSTGRES_PASSWORD: steuereule
      POSTGRES_DB: steuereule
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U steuereule -d steuereule']
      interval: 5s
      timeout: 5s
      retries: 10

  # Shared run log for the owl's answers and shared rate-limit counters (ADR-0064), the same Redis
  # the cluster runs. The API only uses it when REDIS_URL is set (see .env.example); without the
  # variable everything stays in the API process, which is enough for one local instance.
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Local inbox for every mail the API sends (verification, password reset).
  # Web UI: http://localhost:8025 · SMTP: localhost:1025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025'
      - '${MAILPIT_PORT:-8025}:8025'

volumes:
  # Named volume so data survives `docker compose stop`/`up` (only `down -v` clears it) —
  # the PO's local stack keeps its seeded data across restarts.
  postgres-data:
  redis-data:
